<style>
:root{--bg:#f7f9fb;--ink:#14232b;--muted:#56656e;--line:rgba(15,35,45,.10);--brand:#0e7c86;--card:#fff;--ok:#0a7a3d;--ok-bg:#e3f6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:22px} header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.live{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#e3f6ea;color:#0a7a3d;margin-left:4px}
.live.off{background:#f1f3f5;color:var(--muted)}
.resv-btn{flex:none;font:inherit;font-size:13px;font-weight:700;color:var(--ok);background:var(--ok-bg);border:0;border-radius:99px;padding:8px 12px;cursor:pointer}
.quick{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick a{flex:none;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;text-decoration:none}
.seg{position:sticky;top:0;z-index:5;display:flex;gap:6px;margin:12px -16px 0;padding:8px 16px;background:var(--bg)}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.seg button span{display:block;font-size:11px;font-weight:500}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
section{margin-top:14px} section[hidden]{display:none}
h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.dn{background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;table-layout:fixed}
th{background:#eef3f6;color:var(--muted);font-size:12px;font-weight:600;text-align:left;padding:8px 10px}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer} tbody tr:active td{background:#f1f6f8}
.c-t{width:60px;font-weight:700;font-variant-numeric:tabular-nums;border-left:4px solid var(--c,transparent)}
th.c-t{border-left:4px solid transparent}
.c-g{width:84px;text-align:right;vertical-align:middle}
.more{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--brand);background:rgba(14,124,134,.12);border:1px solid rgba(14,124,134,.25);padding:7px 10px 7px 12px;border-radius:99px;white-space:nowrap} .more::after{content:"›";font-size:17px;line-height:1;margin-top:-2px}
tbody tr:active .more{background:var(--brand);color:#fff}
td b{display:block;font-size:15px}
.cell{display:flex;gap:10px;align-items:flex-start}
.cell>div{min-width:0;flex:1}
.th{flex:none;width:58px;height:58px;border-radius:10px;object-fit:cover;background:#eef3f6;display:flex;align-items:center;justify-content:center;font-size:26px}
.sh-ph{display:block;width:calc(100% + 36px);margin:-10px -18px 12px;height:190px;object-fit:cover;border-radius:18px 18px 0 0}
td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--c);margin-bottom:2px}
.ok{display:inline-block;margin-top:6px;margin-right:4px;font:inherit;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-bg);border:0;padding:3px 10px;border-radius:99px;cursor:pointer}
.fest{color:#c2410c;background:#fff1e6;text-decoration:none}
footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)} footer a{color:var(--brand)}
.dim{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.handle{width:40px;height:4px;border-radius:9px;background:#d5dde2;margin:0 auto 12px}
.sh-tag{font-size:12px;font-weight:700}
.sheet h3{margin:2px 0 2px;font-size:19px}
.sh-sub{color:var(--muted);font-size:13px;margin:0}
.sh-list{list-style:none;margin:14px 0 0;padding:12px 14px;background:#f5f8fa;border-radius:12px}
.sh-list li{display:flex;gap:8px;padding:4px 0;font-size:14px} .sh-list i{font-style:normal;flex:none;width:20px;text-align:center}
.acts{display:flex;gap:8px;margin-top:14px}
.acts a,.acts button{flex:1;text-align:center;font:inherit;font-size:14px;font-weight:700;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.acts .pri{background:var(--brand);border-color:var(--brand);color:#fff}
.rv{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;padding:12px 14px;font-size:14px}
.rv dt{color:var(--muted)} .rv dd{margin:0;font-weight:600}
.rv-shot{position:relative;display:block;border-top:1px solid var(--line);cursor:zoom-in}
.rv-shot img{display:block;width:100%;height:170px;object-fit:cover;object-position:top}
.rv-shot span{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:5px 10px;border-radius:99px}
.rv-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rv-item:first-of-type{border-top:0}
.rv-item img{width:56px;height:56px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line)}
.rv-item b{display:block} .rv-item small{color:var(--muted)}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:none;overflow:auto;padding:16px}
.zoom.on{display:block} .zoom img{display:block;max-width:100%;margin:0 auto;border-radius:8px}
.zoom button{position:fixed;top:12px;right:12px;font:inherit;font-size:14px;font-weight:700;border:0;border-radius:99px;padding:8px 14px;background:#fff;cursor:pointer}
.m-chips{display:flex;gap:6px;margin-bottom:10px}
.m-chip{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.m-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mapbox{height:56vh;min-height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#eef3f6;position:relative;isolation:isolate;z-index:0}
.map-loading{height:100%;display:grid;place-items:center;color:var(--muted);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.pin{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:pointer}
.maplibregl-popup-content{font-family:inherit;font-size:13px;border-radius:12px;padding:10px 12px} .maplibregl-popup-content a{color:var(--brand);font-weight:700}
.m-sum{margin:10px 2px 0;font-size:13px;font-weight:700}
.m-list{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 0 8px}
.m-day{font-size:12px;font-weight:800;color:var(--muted);padding:12px 14px 6px}
.stop{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer} .stop:active{background:#f1f6f8}
.stop .num{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;flex:none}
.st-time{width:42px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.st-main{min-width:0} .st-main b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .st-main small{color:var(--muted);font-size:12px}
.leg{margin:0 14px 0 25px;padding:3px 0 3px 22px;border-left:2px dashed var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.m-note{font-size:12px;color:var(--muted);margin:8px 2px 0}
@media (max-width:420px){.th{width:50px;height:50px;font-size:22px}.cell{gap:8px}main{padding:16px 12px 32px}.seg{margin:12px -12px 0;padding:8px 12px}td{padding:11px 8px}.c-t{width:54px}.c-g{width:78px}.more{padding:6px 8px 6px 10px;font-size:12.5px}}
</style></head><body><main>

// 화면 그리기
function render(data) {
  ROWS = TripLive.rows(data);
  DAYS = [...new Set(ROWS.map((r) => r.day))].sort();
  $("#seg").innerHTML = DAYS.map((d, i) => `<button type="button" data-day="${i + 1}">DAY ${i + 1}<span>${TripLive.dayLabel(d)}</span></button>`).join("")
    + '<button type="button" data-day="map">🗺️ 동선<span>지도</span></button>';
  $("#days").innerHTML = DAYS.map((d, i) => {
    const t = new Date(d + "T00:00:00");
    const body = ROWS.map((r, k) => [r, k]).filter(([r]) => r.day === d).map(([r, k]) => {
      let badge = r.resv ? `<button type="button" class="ok" data-resv="${k}">✅ 예약 완료 ›</button>` : "";
      if (r.link) badge += `<a class="ok fest" href="${esc(r.link[0])}">${esc(r.link[1])}</a>`;
      return `<tr data-row="${k}" style="--c:${r.color}"><td class="c-t">${r.time}</td>
        <td><div class="cell">${r.photo ? `<img class="th" src="${esc(r.photo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=th>${r.ic}</span>'">` : `<span class="th">${r.ic}</span>`}<div><span class="tag">${r.ic} ${esc(r.tag)}</span><b>${esc(r.name)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ""}${badge}</div></div></td>
        <td class="c-g"><span class="more">자세히</span></td></tr>`;
    }).join("");
    return `<section data-day="${i + 1}"><h2><span class="dn">DAY ${i + 1}</span>${t.getMonth() + 1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})</h2>
      <table><thead><tr><th class="c-t">시간</th><th>일정</th><th class="c-g"></th></tr></thead><tbody>${body}</tbody></table></section>`;
  }).join("") + renderMapSec();
  RAW = data; mapDrawn = "";

  let cur = 1;

  if (DAYS.indexOf(iso) >= 0 && cur !== "map") cur = DAYS.indexOf(iso) + 1;
  show(cur === "map" ? "map" : cur > DAYS.length ? 1 : cur);
}

function show(n) {
  document.querySelectorAll("section[data-day]").forEach((x) => (x.hidden = x.dataset.day !== String(n)));
  document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.day === String(n)));

  if (String(n) === "map") drawMap();
}

    const j = document.createElement("script"); j.src = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
    j.onload = () => ok(window.maplibregl); j.onerror = no; document.head.appendChild(j);
  });
}
const SLOT_IC = { meal: "🍽️", cafe: "☕", bbq: "🔥", spot: "📸", shop: "🛒" };
const NEAR = (p) => p && p.lat != null && p.lat < 35.2;   // 거제 · 통영 범위
function mapStops(d) {
  const rows = [];
  for (const i of d.items || []) {
    const g = i.geo && i.geo.at;
    if (!NEAR(g)) continue;
    rows.push({ day: i.day, time: (i.time || "").slice(0, 5), name: g.name, lat: g.lat, lng: g.lng, ic: "🏠",
                label: (i.title || "").replace(/^\S+\s+/, "").split(" — ")[0] });
  }
  for (const s of d.slots || []) {
    const o = s.chosen;
    if (!NEAR(o)) continue;
    const t = s.title || "";
    rows.push({ day: s.day, time: (s.time || "").slice(0, 5), name: o.title, lat: o.lat, lng: o.lng,
                ic: t.includes("아침") || t.includes("아점") ? "🍳" : SLOT_IC[s.kind] || "📍", label: t, url: o.url });
  }
  rows.sort((a, b) => (a.day + a.time).localeCompare(b.day + b.time));
  const out = [];
  for (const r of rows) {
    const l = out[out.length - 1];
    if (l && l.day === r.day && Math.abs(l.lat - r.lat) < 1e-4 && Math.abs(l.lng - r.lng) < 1e-4) continue;
    out.push({ ...r, dayN: DAYS.indexOf(r.day) });
  }
  return out;
}
// 차 경로 — 기기에 기억해 두고, 없으면 길찾기(OSRM)
async function carRoute(pts) {
  const key = pts.map((p) => p.lng.toFixed(5) + "," + p.lat.toFixed(5)).join(";");
  try { const c = localStorage.getItem("tl-route:" + key); if (c) return JSON.parse(c); } catch (e) {}
  const r = await fetch("https://router.project-osrm.org/route/v1/driving/" + key + "?overview=full&geometries=geojson");
  const d = await r.json();
  if (d.code !== "Ok") throw new Error(d.code);
  const out = { line: d.routes[0].geometry.coordinates, legs: d.routes[0].legs.map((l) => ({ km: l.distance / 1000, min: l.duration / 60 })) };
  try { localStorage.setItem("tl-route:" + key, JSON.stringify(out)); } catch (e) {}
  return out;
}
const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}시간 ${Math.round(m % 60)}분` : `${Math.round(m)}분`;
function stopListHtml(stops, legs) {
  let h = "", cur = null;
  stops.forEach((s, i) => {
    if (s.day !== cur) { cur = s.day; h += `<div class="m-day">DAY ${s.dayN + 1} · ${TripLive.dayLabel(s.day)}</div>`; }
    else { const g = legs[i]; h += `<div class="leg">${g ? `🚗 ${g.km.toFixed(g.km < 10 ? 1 : 0)}km · ${fmtMin(g.min)}` : "🚗 길 찾는 중"}</div>`; }
    h += `<div class="stop" data-si="${i}"><span class="num" style="background:${DCOL[s.dayN] || DCOL[0]}">${i + 1}</span>
      <span class="st-time">${s.time}</span><div class="st-main"><b>${s.ic} ${esc(s.name)}</b><small>${esc(s.label)}</small></div></div>`;
  });
  return h;
}
function renderMapSec() {
  const chips = [["all", "전체"], ...DAYS.map((d, i) => [d, `DAY ${i + 1}`])]
    .map(([v, l]) => `<button type="button" class="m-chip${mapDay === v ? " on" : ""}" data-mday="${v}">${l}</button>`).join("");
  return `<section data-day="map" hidden><h2><span class="dn">동선</span>거제 · 통영 지도</h2>
    <div class="m-chips">${chips}</div>
    <div class="mapbox" id="map"><div class="map-loading"><span><span class="spin"></span>지도를 불러오는 중</span></div></div>
    <p class="m-sum" id="mSum"></p><div class="m-list" id="mList"></div>
    <p class="m-note">기차 구간은 빼고 거제 · 통영 안에서 차로 다니는 길만 그려요. 거리 · 시간은 어림값이에요.</p></section>`;
}
async function drawMap(force) {
  const el = $("#map");
  if (!el || !RAW) return;
  const all = mapStops(RAW), stops = mapDay === "all" ? all : all.filter((s) => s.day === mapDay);
  const sig = mapDay + JSON.stringify(stops.map((s) => [s.day, s.time, s.lat, s.lng]));
  if (!force && sig === mapDrawn && mapObj) { mapObj.resize(); return; }
  mapDrawn = sig;
  const legs = [];
  $("#mList").innerHTML = stopListHtml(stops, legs);
  const groups = [...new Set(stops.map((s) => s.day))].map((d) => ({
    dayN: DAYS.indexOf(d), idx: stops.map((s, i) => [s, i]).filter(([s]) => s.day === d).map(([, i]) => i),
  })).filter((g) => g.idx.length > 1);
  const routed = Promise.all(groups.map((g) => carRoute(g.idx.map((i) => stops[i])).then((r) => ({ g, r }), () => ({ g, r: null }))));
  let ml;
  try { ml = await loadML(); } catch (e) { el.innerHTML = '<div class="map-loading">지도를 불러오지 못했어요</div>'; return; }
  if (mapObj) { mapObj.remove(); mapObj = null; }
  el.innerHTML = "";
  const lngs = stops.map((s) => s.lng), lats = stops.map((s) => s.lat);
  const map = mapObj = new ml.Map({
    container: el, style: "https://tiles.openfreemap.org/styles/positron", attributionControl: { compact: true },
    localIdeographFontFamily: "'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif",
    dragRotate: false, pitchWithRotate: false,
    ...(stops.length > 1 ? { bounds: [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], fitBoundsOptions: { padding: 40 } }
      : { center: stops[0] ? [stops[0].lng, stops[0].lat] : [128.6, 34.8], zoom: 12 }),
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new ml.NavigationControl({ showCompass: false }), "bottom-right");
  const pops = stops.map((s, i) => {
    const pin = document.createElement("div");
    pin.className = "pin"; pin.style.setProperty("--c", DCOL[s.dayN] || DCOL[0]); pin.textContent = i + 1;
    const pop = new ml.Popup({ offset: 18, closeButton: false }).setHTML(`<b>${i + 1}. ${s.ic} ${esc(s.name)}</b><br>${TripLive.dayLabel(s.day)} ${s.time} · ${esc(s.label)}`
      + (s.url ? `<br><a href="${esc(s.url)}" target="_blank" rel="noopener">네이버 지도 ›</a>` : ""));
    new ml.Marker({ element: pin }).setLngLat([s.lng, s.lat]).setPopup(pop).addTo(map);
    return pop;
  });
  $("#mList").onclick = (e) => {
    const st = e.target.closest("[data-si]"); if (!st) return;
    const i = +st.dataset.si, s = stops[i];
    pops.forEach((p) => p.remove());
    map.flyTo({ center: [s.lng, s.lat], zoom: 14 });
    pops[i].setLngLat([s.lng, s.lat]).addTo(map);
    scrollTo({ top: el.getBoundingClientRect().top + scrollY - 70, behavior: "smooth" });
  };
  map.on("load", async () => {
    const done = await routed;
    if (mapObj !== map) return;
    let km = 0, min = 0;
    const feats = done.map(({ g, r }) => {
      if (r) r.legs.forEach((l, k) => { legs[g.idx[k + 1]] = l; km += l.km; min += l.min; });
      return { type: "Feature", properties: { color: DCOL[g.dayN] || DCOL[0] },
               geometry: { type: "LineString", coordinates: r ? r.line : g.idx.map((i) => [stops[i].lng, stops[i].lat]) } };
    });
    map.addSource("car", { type: "geojson", data: { type: "FeatureCollection", features: feats } });
    map.addLayer({ id: "car-casing", type: "line", source: "car", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#fff", "line-width": 8 } });
    map.addLayer({ id: "car", type: "line", source: "car", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": ["get", "color"], "line-width": 4.5 } });
    $("#mSum").textContent = `${stops.length}곳 · 🚗 ${Math.round(km)}km · ${fmtMin(min)}`;
    $("#mList").innerHTML = stopListHtml(stops, legs);
  });
}
$("#days").addEventListener("click", (e) => {
  const c = e.target.closest("[data-mday]"); if (!c) return;
  mapDay = c.dataset.mday;
  document.querySelectorAll(".m-chip").forEach((b) => b.classList.toggle("on", b === c));
  drawMap(true);
});

// 처음엔 저장본으로 그리고, DB 에서 읽히면 바로 바꾼다
if (SNAP) render(SNAP);
function refresh() {
  TripLive.load().then((d) => {
    render(d);
    const t = new Date();
    $("#liveTag").className = "live";
    $("#liveTag").textContent = `실시간 · ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")} 반영`;
  }).catch(() => {
    $("#liveTag").className = "live off";
    $("#liveTag").textContent = "저장본";
  });
}
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
<script>
// 새 버전 확인 — GitHub Pages 가 10분 캐시하므로 서버의 Last-Modified 가 더 새로우면 다시 불러온다
(function () {
  function check() {
    fetch(location.pathname, { method: "HEAD", cache: "no-store" }).then(function (r) {
      var lm = Date.parse(r.headers.get("last-modified") || "");
      var cur = new Date(document.lastModified).getTime();
      if (lm && cur && lm - cur > 2000) location.replace(location.pathname + "?v=" + lm + location.hash);
    }).catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();
</script>
