<style>
:root{--bg:#f7f9fb;--ink:#14232b;--muted:#56656e;--line:rgba(15,35,45,.10);--brand:#0e7c86;--card:#fff;--ok:#0a7a3d;--ok-bg:#e3f6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:22px} header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.live{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#e3f6ea;color:#0a7a3d;margin-left:4px}
.live.off{background:#f1f3f5;color:var(--muted)}
.resv-btn{flex:none;font:inherit;font-size:13px;font-weight:700;color:var(--ok);background:var(--ok-bg);border:0;border-radius:99px;padding:8px 12px;cursor:pointer}
.quick{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick a{flex:none;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;text-decoration:none}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let ROWS = [], DAYS = [];

// 화면 그리기
function render(data) {
  ROWS = TripLive.rows(data);
  DAYS = [...new Set(ROWS.map((r) => r.day))].sort();
  $("#seg").innerHTML = DAYS.map((d, i) => `<button type="button" data-day="${i + 1}">DAY ${i + 1}<span>${TripLive.dayLabel(d)}</span></button>`).join("");
  $("#days").innerHTML = DAYS.map((d, i) => {
    const t = new Date(d + "T00:00:00");
    const body = ROWS.map((r, k) => [r, k]).filter(([r]) => r.day === d).map(([r, k]) => {
      let badge = r.resv ? `<button type="button" class="ok" data-resv="${k}">✅ 예약 완료 ›</button>` : "";
      if (r.link) badge += `<a class="ok fest" href="${esc(r.link[0])}">${esc(r.link[1])}</a>`;
      return `<tr data-row="${k}" style="--c:${r.color}"><td class="c-t">${r.time}</td>
        <td><span class="tag">${r.ic} ${esc(r.tag)}</span><b>${esc(r.name)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ""}${badge}</td>
        <td class="c-g"><span class="more">자세히</span></td></tr>`;
    }).join("");
    return `<section data-day="${i + 1}"><h2><span class="dn">DAY ${i + 1}</span>${t.getMonth() + 1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})</h2>
      <table><thead><tr><th class="c-t">시간</th><th>일정</th><th class="c-g"></th></tr></thead><tbody>${body}</tbody></table></section>`;
  }).join("");
  $("#resvAll").textContent = "📋 예약 " + ROWS.filter((r) => r.resv).length;
  let cur = 1;
  try { cur = +localStorage.getItem("tl_day") || 1; } catch (e) {}
  const now = new Date(), iso = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  if (DAYS.indexOf(iso) >= 0) cur = DAYS.indexOf(iso) + 1;
  show(cur > DAYS.length ? 1 : cur);
}

// DAY 선택
function show(n) {
  document.querySelectorAll("section[data-day]").forEach((x) => (x.hidden = x.dataset.day !== String(n)));
  document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.day === String(n)));
  try { localStorage.setItem("tl_day", n); } catch (e) {}
}
$("#seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { show(b.dataset.day); scrollTo({ top: 0 }); } };

// 팝업
function openSheet(html) {
  $("#sheet").innerHTML = '<div class="handle"></div>' + html;
  $("#sheet").scrollTop = 0;
  $("#dim").classList.add("on"); $("#sheet").classList.add("on"); document.body.classList.add("lock");
}
function closeSheet() { $("#dim").classList.remove("on"); $("#sheet").classList.remove("on"); document.body.classList.remove("lock"); }
$("#dim").onclick = closeSheet;
addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#zoom").classList.remove("on"); closeSheet(); } });

const memoItem = (t) => {
  const m = t.match(/^(\p{Extended_Pictographic}️?|\S)\s+(.*)$/u);
  return m ? `<li><i>${m[1]}</i><span>${esc(m[2])}</span></li>` : `<li><i>·</i><span>${esc(t)}</span></li>`;
};
function resvBox(v) {
  return `<div class="rv"><dl><dt>일시</dt><dd>${esc(v.when)}</dd><dt>인원</dt><dd>${esc(v.people)}</dd>
    <dt>상태</dt><dd>${esc(v.status)}</dd><dt>예약번호</dt><dd>${esc(v.no)}</dd>
    ${v.tel ? `<dt>전화</dt><dd><a href="tel:${esc(v.tel)}">${esc(v.tel)}</a></dd>` : ""}
    ${v.note ? `<dt>주차</dt><dd>${esc(v.note)}</dd>` : ""}</dl>
    ${v.img ? `<div class="rv-shot" data-zoom="${esc(v.img)}"><img src="${esc(v.img)}" alt="예약 화면"><span>🔍 예약 화면 크게 보기</span></div>` : ""}</div>`;
}
function openRow(k, resvFirst) {
  const r = ROWS[k];
  const head = `<div class="sh-tag" style="color:${r.color}">${r.ic} ${esc(r.tag)} · ${TripLive.dayLabel(r.day)} ${r.time}</div>
    <h3>${esc(r.name)}</h3>${r.sub ? `<p class="sh-sub">${esc(r.sub)}</p>` : ""}`;
  const memo = r.memoLines.length ? `<ul class="sh-list">${r.memoLines.map(memoItem).join("")}</ul>` : "";
  const link = r.link ? `<a href="${esc(r.link[0])}">${esc(r.link[1].replace(" ›", ""))}</a>` : "";
  const acts = `<div class="acts">${r.url ? `<a class="pri" href="${esc(r.url)}" target="_blank" rel="noopener">네이버 지도</a>` : ""}${link}<button type="button" data-close>닫기</button></div>`;
  openSheet(head + (r.resv ? (resvFirst ? resvBox(r.resv) + memo : memo + resvBox(r.resv)) : memo) + acts);
}
function openResvAll() {
  const list = ROWS.map((r, k) => [r, k]).filter(([r]) => r.resv);
  openSheet(`<h3>📋 예약 현황</h3><p class="sh-sub">${list.length}곳 예약함</p>
    <div style="margin-top:10px">${list.map(([r, k]) => `<div class="rv-item" data-open="${k}">
      ${r.resv.img ? `<img src="${esc(r.resv.img)}" alt="">` : ""}
      <div><b>✅ ${esc(r.name)}</b><small>${esc(r.resv.when)} · ${esc(r.resv.people)} · ${esc(r.resv.status)}</small></div></div>`).join("") || '<p class="sh-sub">아직 예약한 곳이 없어요</p>'}</div>
    <div class="acts"><button type="button" data-close>닫기</button></div>`);
}
$("#resvAll").onclick = openResvAll;
$("#days").onclick = (e) => {
  if (e.target.closest("a")) return;
  const tr = e.target.closest("tr[data-row]");
  if (tr) openRow(+tr.dataset.row, !!e.target.closest("[data-resv]"));
};
$("#sheet").onclick = (e) => {
  if (e.target.closest("[data-close]")) return closeSheet();
  const o = e.target.closest("[data-open]"); if (o) return openRow(+o.dataset.open, true);
  const z = e.target.closest("[data-zoom]");
  if (z) { $("#zoom img").src = z.dataset.zoom; $("#zoom").classList.add("on"); $("#zoom").scrollTop = 0; }
};
$("#zoom").onclick = (e) => { if (e.target.tagName !== "IMG") $("#zoom").classList.remove("on"); };

// 처음엔 저장본으로 그리고, DB 에서 읽히면 바로 바꾼다
if (SNAP) render(SNAP);
function refresh() {
  TripLive.load().then((d) => {
    render(d);
    const t = new Date();
    $("#liveTag").className = "live";
    $("#liveTag").textContent = `실시간 · ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")} 반영`;
  }).catch(() => {
    $("#liveTag").className = "live off";
    $("#liveTag").textContent = "저장본";
  });
}
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
<script>
// 새 버전 확인 — GitHub Pages 가 10분 캐시하므로 서버의 Last-Modified 가 더 새로우면 다시 불러온다
(function () {
  function check() {
    fetch(location.pathname, { method: "HEAD", cache: "no-store" }).then(function (r) {
      var lm = Date.parse(r.headers.get("last-modified") || "");
      var cur = new Date(document.lastModified).getTime();
      if (lm && cur && lm - cur > 2000) location.replace(location.pathname + "?v=" + lm + location.hash);
    }).catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();
</script>
