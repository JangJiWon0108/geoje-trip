// ─────────────────────────────────────────────────────────────
// 동선 — 고른 곳들을 시간순으로 지도에. 기차는 점선, 차는 실제 도로(OSRM)
// ─────────────────────────────────────────────────────────────
let routeDay = "all";
const DAY_COLOR = ["#ff6b5a", "#0e8f8f", "#7c5cff"];
const MAP_STYLE = "https://tiles.openfreemap.org/styles/positron";
let mapLibP = null, map = null;
let routeGo = null;   // 동선 차를 n번째 장소로 보내기(차가 준비되면 setupCar 가 채운다)

// 지도 라이브러리(MapLibre) — 앱을 열면 미리 받아 두고, 동선 탭에서 바로 쓴다
function loadMap() {
  return mapLibP ||= new Promise((ok, no) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
    js.onload = () => ok(window.maplibregl);
    js.onerror = no;
    document.head.appendChild(js);
  });
}
function preloadMap() {
  const later = window.requestIdleCallback || (f => setTimeout(f, 1200));
  later(() => { loadMap().catch(() => {}); routeStops().length && prefetchRoutes(); });
}

// 들를 곳 목록 — 일정(기차 · 숙소)과 고른 슬롯을 시간순으로
function routeStops() {
  const rows = [
    ...byKind("schedule").map(r => ({ day: r.day, time: r.time, r })),
    ...slots.map(s => ({ day: s.day, time: s.time, s })),
  ].sort((a, b) => (a.day || "").localeCompare(b.day || "") || (a.time || "").localeCompare(b.time || ""));
  const days = [...new Set(rows.map(x => x.day).filter(Boolean))];
  const stops = [];
  const push = p => {
    const last = stops[stops.length - 1];
    const same = last && last.day === p.day && Math.abs(last.lat - p.lat) < 1e-4 && Math.abs(last.lng - p.lng) < 1e-4;
    if (!same) stops.push({ ...p, dayN: days.indexOf(p.day) });
  };
  for (const row of rows) {
    const time = (row.time || "").slice(0, 5);
    if (row.r) {
      const g = row.r.geo;
      if (!g) continue;
      if (g.from) {
        push({ day: row.day, time, name: g.from.name, lat: g.from.lat, lng: g.from.lng, ic: "🚄", label: "기차 출발" });
        push({ day: row.day, time: g.to.time || "", name: g.to.name, lat: g.to.lat, lng: g.to.lng, ic: "🚉", label: "기차 도착", via: "train" });
      } else if (g.at) {
        push({ day: row.day, time, name: g.at.name, lat: g.at.lat, lng: g.at.lng, ic: g.end ? "🏁" : "🏠",
               label: g.end ? "해산" : row.r.title.replace(/^🏠\s*/, "").split(" — ")[0] });
      }
    } else {
      const o = chosenOf(row.s);
      if (o && o.lat != null) push({ day: row.day, time, name: o.title, lat: o.lat, lng: o.lng, ic: slotIcon(row.s), label: row.s.title });
    }
  }
  return stops;
}

// 구간 나누기 — 기차 / 같은 날 차로 이어지는 묶음(묶음마다 길찾기 한 번)
function splitRuns(stops) {
  const runs = [];
  for (let i = 1; i < stops.length; i++) {
    if (stops[i].via === "train") continue;
    const run = runs[runs.length - 1];
    if (run && run.end === i - 1 && run.day === stops[i].day) { run.idx.push(i); run.end = i; }
    else runs.push({ day: stops[i].day, dayN: stops[i].dayN, start: i - 1, end: i, idx: [i] });
  }
  return runs;
}

// 차 경로 — 기기 기억 → 공용 DB(trip_routes) → 길찾기(OSRM) 순서. 처음 한 사람만 기다린다
const routeMem = new Map();
async function carRoute(points) {
  const key = points.map(p => p.lng.toFixed(5) + "," + p.lat.toFixed(5)).join(";");
  if (routeMem.has(key)) return routeMem.get(key);
  const job = (async () => {
    try { const c = lsGet("geoje-route2:" + key); if (c) return JSON.parse(c); } catch (e) {}
    if (remote && client) {
      const { data } = await client.from("trip_routes").select("data").eq("key", key).maybeSingle();
      if (data) { lsSet("geoje-route2:" + key, JSON.stringify(data.data)); return data.data; }
    }
    const r = await fetch("https://router.project-osrm.org/route/v1/driving/" + key + "?overview=full&geometries=geojson");
    const d = await r.json();
    if (d.code !== "Ok") throw new Error(d.code);
    const out = { line: d.routes[0].geometry.coordinates.map(([x, y]) => [+x.toFixed(5), +y.toFixed(5)]),
                  legs: d.routes[0].legs.map(l => ({ km: l.distance / 1000, min: l.duration / 60 })) };
    lsSet("geoje-route2:" + key, JSON.stringify(out));
    if (remote && client) client.from("trip_routes").insert({ key, data: out }).then(() => {}, () => {});
    return out;
  })();
  routeMem.set(key, job);
  job.catch(() => routeMem.delete(key));
  return job;
}
function prefetchRoutes() {
  const stops = routeStops();
  splitRuns(stops).forEach(run => carRoute(stops.slice(run.start, run.end + 1)).catch(() => {}));
}

const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}시간 ${Math.round(m % 60)}분` : `${Math.round(m)}분`;

function renderRoute() {
  const stops = routeStops();
  const days = [...new Set(stops.map(s => s.day))];
  const chips = [["all", "전체"], ...days.map((d, i) => [d, `DAY ${i + 1}`])]
    .map(([v, l]) => `<button class="chip${routeDay === v ? " on" : ""}" data-rday="${v}">${l}</button>`).join("");
  return `<div class="sec-h"><h2>동선</h2><span class="meta" id="routeSum">${stops.length}곳</span></div>
    <div class="chips">${chips}</div>
    <div class="map card" id="map"><div class="map-loading"><span class="spin"></span>지도를 불러오는 중</div></div>
    <div id="routeList"></div>`;
}

// 아래 목록 — 들르는 순서, 구간 거리 · 시간
function routeListHtml(stops, legs) {
  let html = `<div class="route-list card">`, cur = null;
  stops.forEach((s, i) => {
    const leg = legs[i];
    if (i && s.day === cur) html += `<div class="leg">${stops[i].via === "train" ? "🚄 기차"
      : leg ? `🚗 ${leg.km.toFixed(leg.km < 10 ? 1 : 0)}km · ${fmtMin(leg.min)}` : `<span class="dots">🚗 길 찾는 중</span>`}</div>`;
    if (s.day !== cur) { cur = s.day; html += `<div class="route-day">DAY ${s.dayN + 1} · ${esc(dayLabel(s.day))}</div>`; }
    html += `<div class="stop" data-stop-i="${i}"><span class="num" style="background:${DAY_COLOR[s.dayN] || DAY_COLOR[0]}">${i + 1}</span>
      <span class="st-time">${esc(s.time || "")}</span><div class="st-main"><b>${s.ic} ${esc(s.name)}</b><small>${esc(s.label)}</small></div></div>`;
  });
  return html + `</div><p class="route-note">고른 곳만 이어서 그려요. 거리 · 시간은 길찾기(OSRM) 어림값이에요.</p>`;
}

async function drawRoute() {
  const el = $("#map");
  if (!el) return;
  const all = routeStops();
  const stops = routeDay === "all" ? all : all.filter(s => s.day === routeDay);
  const runs = splitRuns(stops);
  const legs = [];

  // 목록은 바로, 길찾기는 지도보다 먼저 동시에 시작
  $("#routeList").innerHTML = routeListHtml(stops, legs);
  $("#routeList").onclick = e => {
    const st = e.target.closest("[data-stop-i]");
    if (!st || !map) return;
    const i = +st.dataset.stopI, s = stops[i];
    if (routeGo) routeGo(i); else map.flyTo({ center: [s.lng, s.lat], zoom: 14 });
    const top = ($(".trip-bar") || el).getBoundingClientRect().top + scrollY - 12;
    window.scrollTo({ top, behavior: "smooth" });
  };
  const routed = Promise.all(runs.map(run => carRoute(stops.slice(run.start, run.end + 1))
    .then(r => ({ run, r }), () => ({ run, r: null }))));

  let ml;
  try { ml = await loadMap(); } catch (e) { el.innerHTML = `<div class="map-loading">지도를 불러오지 못했어요</div>`; return; }
  if (!document.body.contains(el)) return;
  el.innerHTML = "";

  // 처음 화면은 울산 · 거제에 맞춘다 — 멀리 있는 수도권(기차 출발 · 도착)은 막대를 끌면 찾아간다
  const local = stops.filter(s => s.lat < 36.3);
  const fit = local.length > 1 ? local : stops;
  const lngs = fit.map(s => s.lng), lats = fit.map(s => s.lat);
  map = new ml.Map({
    container: el, style: MAP_STYLE, attributionControl: { compact: true },
    localIdeographFontFamily: "'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif",
    dragRotate: false, pitchWithRotate: false,
    ...(stops.length > 1
      ? { bounds: [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], fitBoundsOptions: { padding: 44 } }
      : { center: stops[0] ? [stops[0].lng, stops[0].lat] : [127.8, 35.9], zoom: stops[0] ? 12 : 6 }),
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new ml.NavigationControl({ showCompass: false }), "bottom-right");

  // 번호 핀
  const pins = [];
  stops.forEach((s, i) => {
    const pin = document.createElement("div");
    pins.push(pin);
    pin.className = "pin";
    pin.style.setProperty("--c", DAY_COLOR[s.dayN] || DAY_COLOR[0]);
    pin.textContent = i + 1;
    new ml.Marker({ element: pin }).setLngLat([s.lng, s.lat])
      .setPopup(new ml.Popup({ offset: 18, closeButton: false })
        .setHTML(`<b>${i + 1}. ${s.ic} ${esc(s.name)}</b><br>${esc(dayLabel(s.day))} ${esc(s.time)} · ${esc(s.label)}`))
      .addTo(map);
  });

  map.on("load", async () => {
    // 기차 — 점선
    const train = [];
    for (let i = 1; i < stops.length; i++) if (stops[i].via === "train")
      train.push({ type: "Feature", geometry: { type: "LineString", coordinates: [[stops[i - 1].lng, stops[i - 1].lat], [stops[i].lng, stops[i].lat]] } });
    map.addSource("train", { type: "geojson", data: { type: "FeatureCollection", features: train } });
    map.addLayer({ id: "train", type: "line", source: "train", layout: { "line-cap": "round" },
                   paint: { "line-color": "#64748b", "line-width": 3, "line-dasharray": [1.5, 2] } });

    // 차 — 실제 도로(안 되면 곧은 점선), 흰 테두리 + 날짜 색
    const done = await routed;
    if (!map || !document.body.contains(el)) return;
    let km = 0, min = 0;
    const car = done.map(({ run, r }) => {
      const color = DAY_COLOR[run.dayN] || DAY_COLOR[0];
      if (r) r.legs.forEach((l, k) => { legs[run.idx[k]] = l; km += l.km; min += l.min; });
      return { type: "Feature", properties: { color, ok: !!r },
               geometry: { type: "LineString", coordinates: r ? r.line : stops.slice(run.start, run.end + 1).map(p => [p.lng, p.lat]) } };
    });
    map.addSource("car", { type: "geojson", data: { type: "FeatureCollection", features: car } });
    map.addLayer({ id: "car-casing", type: "line", source: "car", layout: { "line-cap": "round", "line-join": "round" },
                   paint: { "line-color": "#ffffff", "line-width": 8 } });
    map.addLayer({ id: "car", type: "line", source: "car", layout: { "line-cap": "round", "line-join": "round" },
                   paint: { "line-color": ["get", "color"], "line-width": 4.5 } });
    $("#routeSum").textContent = `${stops.length}곳 · 🚗 ${Math.round(km)}km · ${fmtMin(min)}`;
    $("#routeList").innerHTML = routeListHtml(stops, legs);
    setupCar(ml, el, stops, runs, done, pins, map);
  });
}

// ─────────────────────────────────────────────────────────────
// 우리 차 🚗 — 진행 막대를 끌거나 칩을 누르면 동선을 따라 천천히 달리고, 카메라가 따라간다
// ─────────────────────────────────────────────────────────────
function setupCar(ml, el, stops, runs, done, pins, map) {
  routeGo = null;
  if (stops.length < 2) return;
  // 1) 경로 한 줄로 잇기 — 기차는 곧은 선, 차는 도로 선. 들르는 곳마다 경로상의 위치를 기억한다
  const byStart = new Map(done.map(({ run, r }) => [run.idx[0], { run, r }]));
  const path = [[stops[0].lng, stops[0].lat]], stopAt = [0];
  for (let i = 1; i < stops.length; i++) {
    const hit = byStart.get(i);
    if (stops[i].via === "train" || !hit) {
      // 차 경로 묶음의 중간 지점은 묶음 시작에서 이미 위치를 잡았다 — 덮어쓰지 않는다
      if (stopAt[i] != null) continue;
      if (!runs.some(r => r.idx.includes(i) && r.idx[0] !== i)) path.push([stops[i].lng, stops[i].lat]);
    } else {
      const line = hit.r ? hit.r.line : stops.slice(hit.run.start, hit.run.end + 1).map(p => [p.lng, p.lat]);
      // 같은 묶음 안의 들를 곳 — 가장 가까운 꼭짓점으로 위치를 잡는다
      const base = path.length;
      path.push(...line.slice(1));
      hit.run.idx.forEach(j => { stopAt[j] = base + nearestIdx(line, [stops[j].lng, stops[j].lat]) - 1; });
      continue;
    }
    stopAt[i] = path.length - 1;
  }
  for (let i = 1; i < stops.length; i++) if (stopAt[i] == null) stopAt[i] = path.length - 1;

  // 2) 차 핀 — 🚗
  const car = document.createElement("div");
  car.className = "carpin";
  car.innerHTML = `<div class="car-tag" id="carTag">출발!</div><div class="car">🚗</div>`;
  const marker = new ml.Marker({ element: car, anchor: "bottom" }).setLngLat(path[0]).addTo(map);

  // 3) 경로 거리를 잰다 — 진행 막대는 들르는 곳마다 같은 간격(서울→울산 기차가 막대를 다 먹지 않게),
  //    한 구간 안에서는 실제 거리 비율로 움직인다
  const cos = Math.cos(stops[0].lat * Math.PI / 180);
  const cum = [0];
  for (let i = 1; i < path.length; i++) {
    const dx = (path[i][0] - path[i - 1][0]) * cos, dy = path[i][1] - path[i - 1][1];
    cum.push(cum[i - 1] + Math.hypot(dx, dy));
  }
  const n = stops.length - 1;
  const at = i => cum[stopAt[Math.max(0, Math.min(n, i))]];

  // 4) 진행 카드 — 지도 위쪽. ◀ 이전 / 막대(들르는 곳마다 눈금, 🚗가 위를 달림) / 다음 ▶ + 들르는 곳 칩(누르면 그곳으로 달려감)
  const color = s => DAY_COLOR[s.dayN] || DAY_COLOR[0];
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const bar = document.createElement("div");
  bar.className = "trip-bar";
  bar.innerHTML = `<div class="tb-top"><span class="tb-now" id="tbNow">출발!</span><span class="tb-pct" id="tbPct">0%</span></div>
    <div class="tb-ctl">
      <button type="button" class="tb-btn prev" id="tbPrev" aria-label="이전 장소">${arrow("M15 5l-7 7 7 7")}</button>
      <div class="tb-track"><div class="tb-fill" id="tbFill"></div>
        ${stops.map((s, i) => `<i class="tb-tick" style="left:${(i / n * 100).toFixed(2)}%;--c:${color(s)}"></i>`).join("")}
        <span class="tb-car" id="tbCar">🚗</span></div>
      <button type="button" class="tb-btn next" id="tbNext" aria-label="다음 장소">${arrow("M9 5l7 7-7 7")}</button>
    </div>
    <div class="tb-stops" id="tbStops">${stops.map((s, i) => `<button type="button" class="tb-stop" data-go="${i}" style="--c:${color(s)}"
      title="${esc(s.name)}"><span>${s.ic}</span><small>${i + 1}</small></button>`).join("")}</div>`;
  // 지도 바로 위에 붙인다(지도 안에 띄우면 지도를 가려서 어색함)
  el.parentNode.querySelectorAll(".trip-bar").forEach(b => b.remove());
  el.before(bar);

  // 5) 카메라 — 끄는 동안 차를 따라가며, 구간 길이에 맞춰 확대(기차는 멀리, 거제 안은 가까이)
  const prevBtn = bar.querySelector("#tbPrev"), nextBtn = bar.querySelector("#tbNext"), tbCar = bar.querySelector("#tbCar");
  const chips = [...bar.querySelectorAll(".tb-stop")];
  const carEl = car.querySelector(".car");
  const cam = { pt: path[0], z: map.getZoom() };
  let follow = false, camRaf = null;
  const zoomFor = i => {
    const a = stops[Math.max(0, Math.min(n, i))], b = stops[Math.max(0, Math.min(n, i + 1))];
    const span = Math.max(Math.abs(a.lng - b.lng) * cos, Math.abs(a.lat - b.lat), .012);
    return Math.max(5.5, Math.min(13.5, Math.log2(360 * el.clientWidth / (256 * span * 2.4))));
  };
  const camLoop = () => {
    if (!el.isConnected) return (camRaf = null);   // 지도가 사라졌으면 멈춘다
    // 가운데는 차에 바짝 붙고(화면 밖으로 안 빠지게), 확대는 느긋하게 바뀐다
    const c = map.getCenter(), z = map.getZoom(), k = .3, kz = .15;
    const nc = [c.lng + (cam.pt[0] - c.lng) * k, c.lat + (cam.pt[1] - c.lat) * k], nz = z + (cam.z - z) * kz;
    map.jumpTo({ center: nc, zoom: nz });
    const settled = Math.abs(nz - cam.z) < .03 && Math.hypot(nc[0] - cam.pt[0], nc[1] - cam.pt[1]) < 1e-4;
    camRaf = follow || !settled ? requestAnimationFrame(camLoop) : null;
  };
  const kick = () => { if (!camRaf && !userCam) camRaf = requestAnimationFrame(camLoop); };
  // 사람이 지도를 만지면(확대·축소·이동) 카메라 따라가기를 바로 멈춘다 — 다음 버튼을 누르면 다시 따라감
  let userCam = false;
  const handOff = () => { userCam = true; follow = false; cancelAnimationFrame(camRaf); camRaf = null; };
  ["wheel", "touchstart", "mousedown", "dblclick"].forEach(t => el.addEventListener(t, handOff, { passive: true, capture: true }));

  // 지나온 길 — 금빛으로 칠해진다
  const glow = { "line-cap": "round", "line-join": "round" };
  map.addSource("trail", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "trail-glow", type: "line", source: "trail", layout: glow,
                 paint: { "line-color": "#ffb703", "line-width": 14, "line-blur": 7, "line-opacity": .45 } });
  map.addLayer({ id: "trail", type: "line", source: "trail", layout: glow,
                 paint: { "line-color": "#ffb703", "line-width": 4.5 } });
  const trail = map.getSource("trail");

  // 지도 위에 잠깐 떴다 사라지는 것(배기 연기 · 장소 이모지 · 날짜 바뀜 띠)
  const spawn = (cls, text, x, y, vars = {}) => {
    const e = document.createElement("i");
    e.className = cls;
    e.textContent = text;
    e.style.left = x + "px"; e.style.top = y + "px";
    Object.entries(vars).forEach(([k, v]) => e.style.setProperty(k, v));
    e.addEventListener("animationend", () => e.remove());
    el.appendChild(e);
  };
  // 배기 연기 — 차 뒤쪽으로 퐁퐁(기차는 구름 연기)
  const puff = (xy, dir, train) => {
    const L = Math.hypot(dir.x, dir.y) || 1, ux = dir.x / L, uy = dir.y / L;
    spawn("puff", train ? "☁️" : "💨", xy.x - ux * 26, xy.y - 16 - uy * 12, {
      "--dx": `${(-ux * 30 + (Math.random() - .5) * 14).toFixed(1)}px`,
      "--f": ux > 0 ? 1 : -1,
    });
  };
  const dayBanner = s => {
    const text = s.dayN === 0 ? "🚀 Day 1 — 출발!" : `🌅 Day ${s.dayN + 1} — 좋은 아침!`;
    spawn("day-banner", text, el.clientWidth / 2, el.clientHeight * .55);
  };

  // 6) 비율 → 경로 위 위치(꼭짓점 사이는 보간) · 기차 구간은 🚄 · 들르는 곳에 닿으면 도착 표시 + 핀 반짝
  let lastStop = -1, cheered = false, lastPuff = 0, lastTrail = 0;
  const place = f => {
    f = Math.max(0, Math.min(1, f));
    const i = Math.min(n - 1, Math.floor(f * n));
    const d = at(i) + (at(i + 1) - at(i)) * (f * n - i);
    let k = 1;
    while (k < cum.length - 1 && cum[k] < d) k++;
    const seg = cum[k] - cum[k - 1] || 1, t = Math.max(0, Math.min(1, (d - cum[k - 1]) / seg));
    const a = path[k - 1], b = path[k] || a;
    const pt = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    marker.setLngLat(pt);
    // 지나온 길은 가끔만 다시 그린다(매 프레임 그리면 버벅임)
    const tsT = performance.now();
    if (tsT - lastTrail > 70 || f === goal) {
      lastTrail = tsT;
      trail.setData({ type: "Feature", geometry: { type: "LineString", coordinates: [...path.slice(0, k), pt] } });
    }

    const train = stops[i + 1].via === "train";
    carEl.textContent = train ? "🚄" : "🚗";
    carEl.style.transform = !train && b[0] !== a[0] && b[0] > a[0] ? "scaleX(-1)" : "none";

    const near = Math.round(f * n), arrived = Math.abs(f * n - near) < .05;
    const s = stops[near], nx = stops[i + 1];
    let tag, now;
    if (f >= 1 && s.ic === "🏁") { tag = "🏁 도착! 해산~"; now = `🏁 ${s.name} · 수고했어요!`; }
    else if (f >= 1) { tag = `${s.ic} 오늘은 여기까지!`; now = `${s.ic} ${s.name} · 오늘 하루 끝 😴`; }   // 하루만 볼 때(첫날은 숙소에서 끝남)
    else if (arrived) { tag = `${s.ic} ${s.name}`; now = `📍 ${near + 1}. ${s.name}${s.time ? ` · ${s.time}` : ""} — ${s.label}`; }
    else { tag = train ? "🚄 칙칙폭폭" : "🚗 부릉부릉"; now = `→ ${i + 2}. ${nx.name}${nx.time ? ` · ${nx.time}` : ""}`; }
    $("#carTag").textContent = tag;
    $("#tbNow").textContent = now;
    car.classList.toggle("arrive", arrived || f >= 1);
    car.classList.toggle("moving", !arrived && f < 1);
    car.classList.toggle("train", train && !arrived);
    $("#tbPct").textContent = `${Math.round(f * 100)}%`;
    $("#tbFill").style.width = `${f * 100}%`;
    tbCar.style.left = `${f * 100}%`;
    tbCar.textContent = train ? "🚄" : "🚗";
    tbCar.style.transform = !train && goal >= cur ? "scaleX(-1)" : "none";   // 🚗는 왼쪽을 보고 있다 — 앞으로 갈 땐 뒤집기

    // 달리는 동안 배기 연기
    const xy = map.project(pt), ts = performance.now();
    if (!arrived && f < 1 && ts - lastPuff > 260) {
      lastPuff = ts;
      const pa = map.project(a), pb = map.project(b);
      puff(xy, { x: pb.x - pa.x, y: pb.y - pa.y }, train);
    }

    // 들르는 곳에 처음 닿을 때 — 진동 · 핀 반짝 · 장소 이모지 뿅 · 날짜 바뀌면 띠(끝까지 가면 큰 폭죽)
    const active = arrived ? near : i + 1;
    chips.forEach((c, j) => { c.classList.toggle("on", j === active); c.classList.toggle("past", j < active); });
    if (arrived && near !== lastStop) {
      lastStop = near;
      vibrate();
      const pin = pins[near];
      if (pin) { pin.classList.remove("pulse"); void pin.offsetWidth; pin.classList.add("pulse"); }
      const row = chips[near].parentNode;
      row.scrollTo({ left: chips[near].offsetLeft - row.clientWidth / 2 + chips[near].offsetWidth / 2, behavior: "smooth" });
      chips[near].classList.remove("boing"); void chips[near].offsetWidth; chips[near].classList.add("boing");
      spawn("stop-pop", s.ic, xy.x, xy.y - 60);
      if (near === 0 || s.dayN !== stops[near - 1].dayN) dayBanner(s);
    }
    if (!arrived) lastStop = -1;
    if (f >= 1 && !cheered) { cheered = true; fx.burst(innerWidth / 2, innerHeight * .4, 70); fx.balloons(5); }
    if (f < .97) cheered = false;

    cam.pt = pt;
    cam.z = zoomFor(arrived ? Math.min(near, n - 1) : i) + (arrived ? .4 : 0);
    if (follow) kick();
  };

  // 7) 운전 — 버튼/칩은 목표만 정하고, 차는 그 목표를 천천히 쫓아간다.
  //    들르는 곳 근처에선 브레이크를 밟듯 느려져서, 여러 칸을 건너뛰어도 장소마다 잠깐씩 머문다
  let cur = 0, goal = 0, driveRaf = null, prevT = 0;
  const drive = t => {
    if (!el.isConnected) return (driveRaf = null);
    const dt = Math.min(.05, (t - prevT) / 1000 || .016);
    prevT = t;
    const gap = goal - cur;
    if (Math.abs(gap) < 1e-4) {
      cur = goal; place(cur);
      driveRaf = null;
      follow = false; kick();
      return;
    }
    const off = Math.abs(cur * n - Math.round(cur * n));           // 0(장소 위) ~ .5(구간 한가운데)
    const speed = (1.8 + Math.abs(gap) * n * .5) * (.6 + off * 1.2); // 들르는 곳/초(장소 근처는 살짝만 느려짐)
    cur += Math.sign(gap) * Math.min(Math.abs(gap), speed * dt / n);
    place(cur);
    driveRaf = requestAnimationFrame(drive);
  };
  // 목표 장소 번호로 출발 — 버튼 상태(처음이면 ◀ 끔, 끝이면 ▶ 끔)도 같이 맞춘다
  const go = idx => {
    idx = Math.max(0, Math.min(n, idx));
    goal = idx / n;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === n;
    userCam = false; follow = true; kick();
    if (!driveRaf) { prevT = performance.now(); driveRaf = requestAnimationFrame(drive); }
  };
  const goalIdx = () => Math.round(goal * n);
  routeGo = go;

  // 8) ◀ ▶ 버튼 — 한 번 누를 때마다 한 곳씩(달리는 중에 또 누르면 그 다음 곳으로 이어 달림)
  prevBtn.addEventListener("click", () => { vibrate(); go(goalIdx() - 1); });
  nextBtn.addEventListener("click", () => { vibrate(); go(goalIdx() + 1); });
  prevBtn.disabled = true;

  // 칩 누르기 — 그곳으로 달려간다
  bar.querySelector("#tbStops").addEventListener("click", e => {
    const c = e.target.closest("[data-go]");
    if (c) go(+c.dataset.go);
  });

  // 키보드 ← → 도 같은 동작(동선 화면이 떠 있을 때만)
  const onKey = e => {
    if (!document.body.contains(bar)) return removeEventListener("keydown", onKey);
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowRight") go(goalIdx() + 1);
    else if (e.key === "ArrowLeft") go(goalIdx() - 1);
  };
  addEventListener("keydown", onKey);

  place(0);
}

// 경로 꼭짓점 중 가장 가까운 곳(위도 보정한 거리)
function nearestIdx(line, [x, y]) {
  const k = Math.cos(y * Math.PI / 180);
  let best = 0, bd = Infinity;
  for (let i = 0; i < line.length; i++) {
    const dx = (line[i][0] - x) * k, dy = line[i][1] - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function render() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#fab").style.display = tab === "route" ? "none" : "";
  if (!loaded) { $("#view").innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`; return; }
  renderHero();
  const view = { schedule: renderSchedule, route: renderRoute, place: renderPlace, check: renderCheck }[tab];
  const note = !remote ? `<div class="notice">데모 모드 — 이 브라우저에만 저장돼요</div>`
             : errMsg ? `<div class="notice err">${esc(errMsg)}</div>` : "";
  if (map) { map.remove(); map = null; }
  $("#view").innerHTML = note + view();
  if (tab === "route") drawRoute();
}

async function reload() {
  const routeSig = tab === "route" && map ? JSON.stringify(routeStops()) : null;
  try {
    [items, people, slots, options] = await Promise.all([
      store.list(), store.people().catch(() => people), store.slots().catch(() => slots), store.options().catch(() => options),
    ]);
    errMsg = "";
  } catch (e) { fail(e); }
  loaded = true;
  if (routeSig && map && tab === "route" && routeSig === JSON.stringify(routeStops())) return renderHero();
  render();
}

// ─────────────────────────────────────────────────────────────
// 바텀시트 — 추가 · 수정
// ─────────────────────────────────────────────────────────────
function fieldHtml(f, row) {
  const v = row ? (row[f.k] ?? "") : (f.type === "seg" ? f.options[0] : "");
  const id = "f_" + f.k;
  if (f.type === "people" && people.length) {
    // 등록된 사람 얼굴로 고른다 — 목록에 없는 기존 값도 남겨 둔다
    const names = people.map(p => p.name);
    if (v && !names.includes(v)) names.push(v);
    const opts = [...names.map(n => [n, `${who(n)}${esc(n)}`]), ["", "미정"]];
    return `<div class="field"><label>${f.label}</label><div class="seg" data-seg="${id}">${opts.map(([o, label]) =>
      `<button type="button" data-v="${esc(o)}" class="${o === v ? "on" : ""}">${label}</button>`).join("")}</div>
      <input type="hidden" id="${id}" value="${esc(v)}"></div>`;
  }
  if (f.type === "switch") {
    return `<div class="field"><label class="toggle-row" for="${id}">${f.label}
      <span class="switch"><input type="checkbox" id="${id}" ${v ? "checked" : ""}><span></span></span></label></div>`;
  }
  if (f.type === "seg") {
    return `<div class="field"><label>${f.label}</label><div class="seg" data-seg="${id}">${f.options.map(o =>
      `<button type="button" data-v="${esc(o)}" class="${o === v ? "on" : ""}">${CATS[o] || ""} ${esc(o)}</button>`).join("")}</div>
      <input type="hidden" id="${id}" value="${esc(v)}"></div>`;
  }
  if (f.type === "textarea") {
    return `<div class="field"><label for="${id}">${f.label}</label><textarea id="${id}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea></div>`;
  }
  const extra = f.type === "number" ? 'inputmode="numeric" min="0" step="100"' : "";
  const val = f.type === "time" ? String(v).slice(0, 5) : v;
  return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" type="${f.type || "text"}"
    ${f.required ? "required" : ""} ${f.list ? `list="${f.list}"` : ""} ${extra}
    placeholder="${esc(f.placeholder || "")}" value="${esc(val)}"></div>`;
}

function flatFields(spec) { return spec.fields.flatMap(f => f.row || [f]); }

function openSheet(kind, row) {
  const spec = FORMS[kind];
  const people = [...new Set(byKind("check").map(r => r.person).filter(Boolean))];
  let html = `<div class="handle"></div><h3>${spec.name} ${row ? "고치기" : "추가"}</h3>`;
  for (const f of spec.fields) {
    html += f.row ? `<div class="two">${f.row.map(x => fieldHtml(x, row)).join("")}</div>` : fieldHtml(f, row);
  }
  html += `<datalist id="people">${people.map(p => `<option value="${esc(p)}">`).join("")}</datalist>
    <div class="actions">${row ? `<button type="button" class="btn danger" id="sDel">삭제</button>` : ""}
    <button type="button" class="btn soft" id="sCancel">취소</button><button class="btn primary">저장</button></div>`;

  openPanel(html, async () => {
    const data = { kind };
    for (const f of flatFields(spec)) {
      const el = $("#f_" + f.k);
      if (f.type === "switch") data[f.k] = el.checked;
      else if (f.type === "number") data[f.k] = el.value === "" ? null : Number(el.value);
      else data[f.k] = el.value.trim() || null;
    }
    // 같은 이름은 한 번만(준비물 · 일정)
    if (byKind(kind).some(r => r.title === data.title && (!row || r.id !== row.id))) return toast("이미 있는 항목이에요");
    closeSheet();
    try {
      row ? await store.update(row.id, data) : await store.insert(data);
      toast(row ? "고쳤어요" : "추가했어요");
    } catch (e) { fail(e); }
    reload();
  }, !row);
  // 새 일정은 날짜를 여행 첫날(여행 중이면 오늘)로 채워 둔다
  if (kind === "schedule" && !row) {
    const days = [...new Set(byKind("schedule").map(r => r.day).filter(Boolean))].sort();
    const today = new Date().toLocaleDateString("sv-SE");
    if (days.length) $("#f_day").value = days.includes(today) ? today : days[0];
  }
  if (row) $("#sDel").onclick = async () => {
    if (!confirm(`«${row.title}» 을(를) 지울까요?`)) return;
    closeSheet();
    items = items.filter(x => x.id !== row.id);
    render();
    try { await store.remove(row.id); toast("지웠어요"); } catch (e) { fail(e); }
    reload();
  };
}

// 시트 공통 — html 을 넣고 분류 버튼 · 취소 · 저장을 잇는다
function openPanel(html, onSubmit, focusFirst) {
  const sheet = $("#sheet");
  sheet.onclick = null;            // 앞 시트(슬롯 고르기)의 클릭 처리를 지운다
  sheet.innerHTML = html;
  sheet.querySelectorAll("[data-seg]").forEach(seg => seg.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("#" + seg.dataset.seg).value = b.dataset.v;
  });
  const cancel = $("#sCancel");
  if (cancel) cancel.onclick = closeSheet;
  sheet.onsubmit = ev => { ev.preventDefault(); onSubmit(); };

  document.body.classList.add("lock-scroll");
  $("#scrim").classList.add("open");
  requestAnimationFrame(() => sheet.classList.add("open"));
  // 폰의 뒤로 가기가 페이지를 떠나지 않고 시트만 닫도록 기록 한 칸을 넣는다
  if (!sheetEntry) {
    try { history.pushState({ sheet: true }, ""); sheetEntry = true; } catch (e) {}
  }
  if (focusFirst) setTimeout(() => sheet.querySelector("input:not([type=hidden]), textarea")?.focus(), 320);
}

let sheetEntry = false;   // 시트를 열 때 넣은 history 칸이 남아 있는지

// viaBack 이 true 면 뒤로 가기로 닫는 것 — 이미 칸이 빠졌으니 history 를 건드리지 않는다
function closeSheet(viaBack) {
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("open");
  document.body.classList.remove("lock-scroll");
  document.activeElement?.blur?.();
  if (sheetEntry) {
    sheetEntry = false;
    if (viaBack !== true) history.back();
  }
}
addEventListener("popstate", () => { if (sheetEntry) closeSheet(true); });

// ─────────────────────────────────────────────────────────────
// 폭죽 · 풍선 — 캔버스 조각 + 떠오르는 이모지
// ─────────────────────────────────────────────────────────────
const fx = (() => {
  const cv = document.createElement("canvas");
  cv.className = "fx";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const COLORS = ["#ff6b5a", "#ffd166", "#06d6a0", "#4cc9f0", "#b388ff", "#ff8fab", "#ffffff"];
  let parts = [], raf = null;

  function size() {
    const r = devicePixelRatio || 1;
    cv.width = innerWidth * r; cv.height = innerHeight * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }
  addEventListener("resize", size);
  size();

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.age < p.life);
    for (const p of parts) {
      p.age++;
      p.vx *= .985; p.vy = p.vy * .985 + .24;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.4, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : null;
  }

  function burst(x, y, n = 80) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, age: 0, life: 60 + Math.random() * 50,
                   w: 6 + Math.random() * 7, h: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .45,
                   c: COLORS[i % COLORS.length], round: Math.random() < .3 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function balloons(n = 3) {
    if (document.querySelectorAll(".balloon").length > 14) return;
    const pick = ["🎈", "🎈", "🎈", "🎉", "💖", "🥳"];
    for (let i = 0; i < n; i++) {
      const b = document.createElement("div");
      b.className = "balloon";
      b.textContent = pick[Math.floor(Math.random() * pick.length)];
      b.style.left = (5 + Math.random() * 85) + "%";
      b.style.fontSize = (34 + Math.random() * 24) + "px";
      b.style.animationDuration = (2.6 + Math.random() * 1.8) + "s";
      b.style.animationDelay = (i * .12) + "s";
      b.addEventListener("animationend", () => b.remove());
      document.body.appendChild(b);
    }
  }

  function float(x, y, text) {
    const e = document.createElement("div");
    e.className = "plus1";
    e.textContent = text;
    e.style.left = x + "px"; e.style.top = y + "px";
    e.addEventListener("animationend", () => e.remove());
    document.body.appendChild(e);
  }
  return { burst, balloons, float };
})();

// ─────────────────────────────────────────────────────────────
// 개발자 응원 — 누가 눌러도 오르는 하나의 숫자(DB 의 cheer())
// ─────────────────────────────────────────────────────────────
let cheerTotal = null;
let cheerQueue = Promise.resolve();

function showCheer(bump) {
  const n = $("#cheerN");
  n.textContent = cheerTotal == null ? "·" : cheerTotal.toLocaleString("ko-KR");
  if (bump) { n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }
}

async function loadCheer() {
  if (!remote || !client) return;
  try {
    const { data } = await client.rpc("cheer_count");
    if (data != null) { cheerTotal = Number(data); showCheer(); }
  } catch (e) {}
}

$("#cheerBtn").onclick = e => {
  const btn = e.currentTarget, r = btn.getBoundingClientRect();
  const x = r.left + 24, y = r.top + r.height / 2;
  fx.burst(x, y);
  fx.float(x, y - 12, "+1");
  fx.balloons(3);
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  vibrate();

  cheerTotal = (cheerTotal || 0) + 1;     // 화면부터 올리고 DB 숫자로 맞춘다
  showCheer(true);
  if (!remote || !client) return;
  cheerQueue = cheerQueue.then(async () => {
    try {
      const { data } = await client.rpc("cheer");
      if (data != null) { cheerTotal = Math.max(cheerTotal, Number(data)); showCheer(); }
    } catch (err) {}
  });
};

// ─────────────────────────────────────────────────────────────
// 버그 신고 — trip_bugs 에 쌓이고 관리자 화면에서 본다
// ─────────────────────────────────────────────────────────────
const BUG_CATS = ["🐛 벌레가 나왔어요", "💥 펑 터졌어요", "🐢 너무 느려요", "🎨 안 예뻐요", "🤯 뭔지 모르겠어요", "💡 이거 해 주세요"];

$("#bugBtn").onclick = () => {
  const seg = BUG_CATS.map((c, i) => `<button type="button" data-v="${esc(c)}" class="${i ? "" : "on"}">${esc(c)}</button>`).join("");
  openPanel(`<div class="handle"></div><h3>🐞 버그 신고</h3>
    <p class="sheet-sub">개발자가 커피 마시면서 꼼꼼히 볼게요 ☕</p>
    <div class="field"><label>어떤 버그인가요</label><div class="seg" data-seg="f_cat">${seg}</div>
      <input type="hidden" id="f_cat" value="${esc(BUG_CATS[0])}"></div>
    <div class="field"><label for="f_content">자세히 알려 주세요</label>
      <textarea id="f_content" required placeholder="언제 · 어디서 · 무엇을 눌렀더니 …"></textarea></div>
    <div class="actions"><button type="button" class="btn soft" id="sCancel">취소</button>
      <button class="btn primary">🚀 보내기</button></div>`, async () => {
    const row = { category: $("#f_cat").value, content: $("#f_content").value.trim() };
    if (!row.content) return $("#f_content").focus();
    closeSheet();
    if (!remote || !client) return toast("데모 모드라 보내지 않았어요");
    try {
      const { error } = await client.from("trip_bugs").insert(row);
      if (error) throw error;
      toast("🚀 개발자에게 날아갔어요");
      fx.burst(innerWidth / 2, innerHeight * .6, 60);
    } catch (e) { fail(e); }
  }, false);
};
$("#scrim").onclick = () => closeSheet();
addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });

// 시트 손잡이를 아래로 끌면 닫는다
(() => {
  const sheet = $("#sheet");
  let y0 = null;
  sheet.addEventListener("touchstart", e => { if (sheet.scrollTop <= 0 && e.target.closest(".handle, h3")) y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transition = "none";
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener("touchend", e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    sheet.style.transition = sheet.style.transform = "";
    y0 = null;
    if (dy > 90) closeSheet();
  });
})();

// ─────────────────────────────────────────────────────────────
// 이벤트
// ─────────────────────────────────────────────────────────────
$("#tabs").onclick = e => {
  const b = e.target.closest(".tab");
  if (!b || b.dataset.tab === tab) return;
  tab = b.dataset.tab;
  lsSet(TAB_KEY, tab);
  vibrate();
  render();
  window.scrollTo({ top: 0 });
};

$("#fab").onclick = () => openSheet(tab);

$("#view").onclick = async e => {
  if (e.target.closest("[data-stop]")) return;
  const fold = e.target.closest("[data-fold-btn]");
  if (fold) {
    const box = fold.closest("[data-fold]"), key = box.dataset.fold;
    box.classList.toggle("open") ? openFolds.add(key) : openFolds.delete(key);
    return;
  }
  const find = id => items.find(x => String(x.id) === id);

  const edit = e.target.closest("[data-edit]");
  if (edit) return openSheet("check", find(edit.dataset.edit));
  const add = e.target.closest("[data-add]");
  if (add) return openSheet(add.dataset.add);
  const rd = e.target.closest("[data-rday]");
  if (rd) { routeDay = rd.dataset.rday; return render(); }
  const filter = e.target.closest("[data-filter]");
  if (filter) { placeFilter = filter.dataset.filter; return render(); }

  // 준비물 체크 — 화면부터 바꾸고 저장한다
  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    const r = find(tog.dataset.toggle);
    if (!r) return;
    r.done = !r.done;
    vibrate();
    render();
    try { await store.update(r.id, { done: r.done }); } catch (err) { fail(err); reload(); }
    return;
  }
  const sl = e.target.closest("[data-slot]");
  if (sl) { const s = slots.find(x => String(x.id) === sl.dataset.slot); if (s) openSlot(s); return; }
  const c = e.target.closest("[data-id]");
  if (c) { const r = find(c.dataset.id); if (r) openSheet(r.kind, r); }
};

// 다른 사람이 고친 내용은 앱으로 돌아올 때 다시 읽는다
document.addEventListener("visibilitychange", () => { if (!document.hidden && client) { reload(); loadCheer(); } });

// ─────────────────────────────────────────────────────────────
// 시작 — 원격이면 여행 암호를 확인한다
// ─────────────────────────────────────────────────────────────
async function tryPass(pass) {
  connect(pass);
  return store.checkPass();
}

function showLock(msg) {
  const lock = $("#lock");
  lock.hidden = false;
  $("#lockErr").textContent = msg || "";
  setTimeout(() => $("#lockInput").focus(), 100);
}

// 암호 보기 / 숨기기
$("#eye").onclick = () => {
  const input = $("#lockInput");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  $("#eye").classList.toggle("on", show);
  input.focus();
};

$("#lockForm").onsubmit = async e => {
  e.preventDefault();
  const input = $("#lockInput"), go = $("#goBtn");
  const pass = input.value.trim();
  if (!pass) return input.focus();
  $("#lockErr").textContent = "";
  go.classList.add("loading");
  try {
    if (await tryPass(pass)) {
      // 맞으면 잠금 화면을 부드럽게 걷어내고 본 화면을 읽는다
      lsSet(PASS_KEY, pass);
      input.blur();
      const lock = $("#lock");
      lock.classList.add("leave");
      setTimeout(() => { lock.hidden = true; lock.classList.remove("leave"); go.classList.remove("loading"); }, 450);
      return afterAuth();
    }
    $("#lockErr").textContent = "암호가 맞지 않아요";
  } catch (err) {
    $("#lockErr").textContent = "연결하지 못했어요 · 잠시 뒤 다시 해 주세요";
  }
  go.classList.remove("loading");
  vibrate();
  const box = $(".glass");
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  input.select();
};

// 암호가 맞은 뒤 — 화면 · 응원 숫자를 불러오고 접속 기록을 남긴다(사람 구분 없이 기기 단위)
function afterAuth() {
  reload().then(preloadMap);
  loadCheer();
  logVisit();
}

async function start() {
  render();
  if (!remote) return reload();
  const saved = lsGet(PASS_KEY);
  if (!saved) return showLock();
  try {
    if (await tryPass(saved)) return afterAuth();
    lsDel(PASS_KEY);
    showLock("암호가 바뀌었어요. 다시 입력해 주세요");
  } catch (e) {
    showLock("연결하지 못했어요 — 잠시 뒤 다시 해 주세요");
  }
}
start();
