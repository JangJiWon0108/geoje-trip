<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거제 여행</title>
<meta name="theme-color" content="#0e7c86">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="거제 여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────────────────────
   색 · 크기 토큰 (라이트 / 다크)
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #f7f9fb;
  --surface: #ffffff;
  --surface-2: #f1f4f7;
  --text: #0f171c;
  --muted: #56656e;
  --line: rgba(15, 35, 45, .10);
  --brand: #0e7c86;
  --brand-2: #2bb3a3;
  --brand-soft: rgba(14, 124, 134, .10);
  --coral: #ff6b5a;
  --ok: #1fa37a;
  --shadow: 0 1px 2px rgba(16, 40, 50, .04), 0 6px 20px rgba(16, 40, 50, .06);
  --glass: rgba(255, 255, 255, .78);
  --radius: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
/* 폰이 다크 모드여도 늘 흰 테마로 보인다(사용자 요청, 2026-10-23) */
:root { color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.45; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
body.lock-scroll { overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ─────────────────────────────────────────────────────────────
   상단 히어로
   ───────────────────────────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden; color: #fff;
  padding: calc(var(--safe-t) + 22px) 20px 54px;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, .22), transparent 60%),
    linear-gradient(150deg, #0b6f8a 0%, #0e8f8f 45%, #32b99f 100%);
}
.hero::after {               /* 물결 */
  content: ""; position: absolute; left: -10%; right: -10%; bottom: -1px; height: 38px;
  background: var(--bg);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.hero-top { display: flex; justify-content: space-between; align-items: center; }
.hero-kicker { font-size: 13px; font-weight: 600; opacity: .85; letter-spacing: .02em; }
.hero h1 { margin: 10px 0 4px; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.hero-sub { font-size: 14px; opacity: .9; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dday { background: #fff; color: var(--brand); font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 99px; }
.hero-wave { position: absolute; right: 14px; top: calc(var(--safe-t) + 54px); font-size: 64px; opacity: .25; transform: rotate(-8deg); }

/* ─────────────────────────────────────────────────────────────
   본문 공통
   ───────────────────────────────────────────────────────────── */
main { max-width: 640px; margin: -26px auto 0; padding: 0 16px calc(170px + var(--safe-b)); position: relative; z-index: 1; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 4px 12px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.sec-h .meta { color: var(--muted); font-size: 14px; }
.notice { background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 13px; color: var(--muted);
          box-shadow: var(--shadow); margin-bottom: 14px; }
.notice.err { color: var(--coral); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .em { font-size: 44px; display: block; margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
.fade-in { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.98); }
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 12px; color: var(--muted);
            display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:active { background: var(--surface-2); }

/* 칩 필터 — 가로 스크롤 */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 14px; margin: 0 -16px; padding-left: 20px; padding-right: 20px;
         scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow);
        padding: 9px 15px; border-radius: 99px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); }
.chip .n { opacity: .55; margin-left: 4px; font-weight: 500; }

/* ─────────────────────────────────────────────────────────────
   일정 — 타임라인
   ───────────────────────────────────────────────────────────── */
.day-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
         padding: calc(var(--safe-t) + 10px) 4px 10px; margin: 0 -4px; background: var(--bg); font-weight: 700; }
.day-n { background: var(--brand); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 8px; letter-spacing: .03em; }
.day-h .d { font-size: 16px; }
.tl { display: grid; grid-template-columns: 52px 18px 1fr; align-items: stretch; }
.tl-time { font-size: 14px; font-weight: 700; color: var(--muted); padding-top: 15px; font-variant-numeric: tabular-nums; }
.tl-rail { position: relative; }
.tl-rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl:first-of-type .tl-rail::before { top: 20px; }
.tl-rail::after { content: ""; position: absolute; left: 3px; top: 18px; width: 12px; height: 12px; border-radius: 50%;
                  background: var(--surface); border: 3px solid var(--dot, var(--brand)); }
.tl-card { margin: 0 0 10px 6px; padding: 13px 16px; cursor: pointer; }

/* 끼니 · 카페 슬롯 */
.plan-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.plan-bar .bar { flex: 1; margin: 0; height: 8px; }
.slot { margin: 0 0 12px 6px; padding: 14px 16px; cursor: pointer; }
.slot-h { display: flex; align-items: center; gap: 9px; }
.slot-ic { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none; background: var(--surface-2); }
.slot-t { font-weight: 800; font-size: 16px; }
.slot-st { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--muted); background: var(--surface-2);
           padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.slot-st.ok { color: #fff; background: var(--ok); }
.cands { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; }
.cand { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); }
.slot-hint { font-size: 12px; color: var(--brand); font-weight: 700; margin-top: 9px; }
.pick-card { margin-top: 11px; padding: 12px 14px; border-radius: 16px; background: var(--brand-soft); }
.pick-title { font-weight: 800; font-size: 17px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pick-card .place-act { align-items: center; }
.swap { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
.slot-memo { font-size: 12px; color: var(--muted); margin-top: 9px; }

/* 세부 항목 — 메모를 한 줄에 하나씩, 앞 이모지는 아이콘 칸으로. 줄이 많으면 접는다 */
.memo { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.memo li { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: var(--text); }
.memo li i { font-style: normal; width: 26px; height: 26px; flex: none; display: grid; place-items: center;
             border-radius: 9px; background: var(--surface-2); font-size: 14px; }
.memo li span { padding-top: 3px; word-break: keep-all; overflow-wrap: anywhere; }
.memo-more { display: none; }
.memo-box.open .memo-more { display: grid; margin-top: 7px; }
.fold-btn { margin-top: 9px; display: inline-flex; align-items: center; gap: 4px; border: 0; cursor: pointer;
            font: inherit; font-size: 12.5px; font-weight: 800; color: var(--brand); background: var(--brand-soft);
            padding: 6px 11px; border-radius: 999px; }
.fold-btn .chev { transition: transform .2s; }
.memo-box.open .fold-btn .chev { transform: rotate(180deg); }
.memo-box .less, .memo-box.open .more { display: none; }
.memo-box.open .less { display: inline; }
.slot.fixed .memo li { color: #fff; font-weight: 600; }
.slot.fixed .memo li i { background: rgba(255, 255, 255, .22); }
.slot.fixed .fold-btn { color: #fff; background: rgba(255, 255, 255, .22); }
.slot.fixed { background: linear-gradient(135deg, #ff9a3c 0%, #ff5f6d 100%); color: #fff; box-shadow: 0 10px 26px rgba(255, 95, 109, .3); }
.slot.fixed .slot-ic { background: rgba(255, 255, 255, .22); }
.slot.fixed .slot-st { background: rgba(255, 255, 255, .25); color: #fff; }
.slot.fixed .slot-memo { color: #fff; opacity: .92; font-size: 14px; font-weight: 600; }
.bdg { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 7px; white-space: nowrap;
       background: var(--surface-2); color: var(--muted); }
.bdg.blue { background: rgba(37, 99, 235, .12); color: #2563eb; }
.bdg.mine { background: rgba(234, 179, 8, .18); color: #b7791f; }
.bdg.season { background: rgba(14, 165, 164, .14); color: #0e8f8f; }
.opts { display: grid; gap: 10px; margin-bottom: 12px; }
.opt { display: flex; gap: 12px; padding: 14px; border-radius: 18px; background: var(--surface-2); border: 2px solid transparent;
       cursor: pointer; transition: border-color .15s, background .15s; }
.opt.on { border-color: var(--brand); background: var(--brand-soft); }
.opt-thumb { position: relative; flex: none; }
.radio { position: absolute; left: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
         background: rgba(0, 0, 0, .28); box-shadow: 0 2px 6px rgba(0, 0, 0, .2); display: grid; place-items: center; }
.opt.on .radio { background: var(--brand); }
.opt.on .radio::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 900; line-height: 1; }

/* 대표 사진 */
.ph { position: relative; overflow: hidden; flex: none; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand-soft), rgba(255, 107, 90, .14)); }
.ph span { font-size: 28px; opacity: .75; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.big { height: 156px; border-radius: 14px; margin: -2px -2px 12px; }
.ph.big span { font-size: 46px; }
.ph.sq { width: 84px; height: 84px; border-radius: 16px; }
.ph.mini { width: 22px; height: 22px; border-radius: 50%; }
.ph.mini span { font-size: 11px; }
.cand { display: inline-flex; align-items: center; gap: 6px; padding-left: 5px; }
.pick-menu { font-size: 14px; font-weight: 600; margin-top: 4px; }
.opt-main { flex: 1; min-width: 0; }
.opt-t { font-weight: 800; font-size: 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.opt-s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.opt-m { font-size: 13px; margin-top: 4px; }
.opt-act { display: flex; gap: 6px; margin-top: 9px; align-items: center; }
.opt-act .icon-btn { margin-left: auto; width: 32px; height: 32px; }
.add-opt { width: 100%; border: 2px dashed var(--line); background: transparent; border-radius: 16px; padding: 13px;
           font-weight: 700; color: var(--brand); cursor: pointer; }
.tl-card b { font-size: 16px; display: block; }
.tl-card p { margin: 3px 0 0; color: var(--muted); font-size: 14px; white-space: pre-wrap; word-break: break-word; }

/* ─────────────────────────────────────────────────────────────
   장소
   ───────────────────────────────────────────────────────────── */
.place { display: flex; gap: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; align-items: center; }
.avatar { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; flex: none;
          background: var(--brand-soft); }
.avatar.맛집 { background: rgba(255, 107, 90, .13); }
.avatar.카페 { background: rgba(176, 120, 72, .14); }
.avatar.숙소 { background: rgba(120, 100, 220, .13); }
.place-main { flex: 1; min-width: 0; }
.place-title { font-weight: 700; font-size: 16px; }
.place-sub { color: var(--muted); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-act { display: flex; gap: 6px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 99px;
        background: var(--brand); color: #fff; }
.pill.ghost { background: var(--surface-2); color: var(--text); }

/* ─────────────────────────────────────────────────────────────
   준비물
   ───────────────────────────────────────────────────────────── */
.progress { padding: 18px 18px 16px; margin-bottom: 16px; }
.progress .big { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
.progress .big small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-2));
         transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.group-h { display: flex; align-items: center; gap: 8px; margin: 18px 6px 8px; font-weight: 700; }
.who { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff;
       flex: none; overflow: hidden; }
img.who { display: block; object-fit: cover; background: var(--surface-2); }

/* 함께 가는 사람 — 상단 얼굴 줄 · 담당자 고르기 · 이름 고르기 */
.crew { display: flex; align-items: center; gap: 10px; margin-top: 12px; position: relative; z-index: 1; }
.crew:empty { display: none; }
.crew-faces { display: flex; }
.crew-faces .who { width: 34px; height: 34px; margin-left: -10px; border: 2px solid rgba(255, 255, 255, .95);
                   box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
.crew-faces .who:first-child { margin-left: 0; }
.crew-txt { font-size: 13px; font-weight: 600; opacity: .92; }
.seg .who { display: inline-block; width: 24px; height: 24px; font-size: 11px; line-height: 24px; text-align: center;
            vertical-align: -7px; margin-right: 5px; }
.picks { display: flex; gap: 14px; margin: 0 0 16px; flex-wrap: wrap; }
.pick { border: 0; background: transparent; padding: 0; display: grid; justify-items: center; gap: 5px; cursor: pointer;
        font-size: 13px; font-weight: 700; color: var(--muted); }
.pick .who { width: 60px; height: 60px; font-size: 22px; border: 3px solid transparent; transition: border-color .15s, transform .15s; }
.pick.on { color: var(--text); }
.pick.on .who { border-color: var(--brand); transform: scale(1.06); }
.group-h .cnt { color: var(--muted); font-size: 13px; font-weight: 600; margin-left: auto; }
.checks { padding: 4px 0; overflow: hidden; }
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; min-height: 54px; cursor: pointer; }
.crow + .crow { border-top: 1px solid var(--line); }
.cbox { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line); flex: none; display: grid; place-items: center;
        transition: all .18s ease; background: var(--surface); }
.crow.done .cbox { background: var(--ok); border-color: var(--ok); transform: scale(1.04); }
.cbox svg { opacity: 0; transform: scale(.5); transition: all .18s ease; }
.crow.done .cbox svg { opacity: 1; transform: none; }
.ctitle { flex: 1; font-size: 16px; transition: color .18s; }
.crow.done .ctitle { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }

/* ─────────────────────────────────────────────────────────────
   하단 탭바 · 추가 버튼
   ───────────────────────────────────────────────────────────── */
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-b)); z-index: 20;
          max-width: 380px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr);
          background: var(--glass); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
          border-radius: 24px; box-shadow: 0 10px 30px rgba(10, 30, 40, .16); border: 1px solid var(--line); padding: 6px; }
.tab { border: 0; background: transparent; padding: 7px 0 6px; border-radius: 18px; display: grid; justify-items: center; gap: 2px;
       color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; transition: color .2s, background .2s; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--brand); background: var(--brand-soft); }
/* 동선 지도 */
.map { height: 58vh; min-height: 340px; overflow: hidden; position: relative; isolation: isolate; z-index: 0; margin-bottom: 14px; }
.map-loading { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.pin { width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-size: 13px; font-weight: 900;
       display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .28); cursor: pointer; }
.map-loading .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand);
                     animation: spin .8s linear infinite; display: inline-block; vertical-align: -4px; margin-right: 8px; }
.dots { opacity: .7; }
.carpin { display: grid; justify-items: center; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .3)); }
.carpin .car { font-size: 38px; line-height: 1; transition: transform .2s; }
.car-tag { margin-bottom: 4px; background: var(--text); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px;
           border-radius: 99px; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
/* 동선 진행 막대 — 지도 바로 위 카드 */
.trip-bar { position: relative; margin-bottom: 10px; padding: 12px 14px 12px; border-radius: 16px;
            background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .07); animation: fade .3s ease; }
.tb-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tb-now { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-pct { font-size: 12px; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
/* 좌우 버튼 + 가운데 막대(🚗가 막대 위를 달림) */
.tb-ctl { display: flex; align-items: center; gap: 12px; }
.tb-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
          background: var(--surface-2); color: var(--text); transition: transform .12s, opacity .2s, box-shadow .2s; }
.tb-btn svg { width: 22px; height: 22px; }
.tb-btn.next { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 4px 12px rgba(14, 143, 143, .35); }
.tb-btn:active { transform: scale(.88); }
.tb-btn:disabled { opacity: .3; cursor: default; transform: none; box-shadow: none; }
.tb-ctl .tb-track { flex: 1; }
.tb-car { position: absolute; top: 50%; font-size: 20px; line-height: 1; translate: -50% -62%; pointer-events: none; z-index: 1; }
.tb-track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); }
.tb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
.tb-tick { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff;
           border: 2px solid var(--c); box-sizing: border-box; pointer-events: none; }
.tb-stops { display: flex; gap: 6px; overflow-x: auto; margin: 12px -14px -2px; padding: 2px 14px 2px; scrollbar-width: none; }
.tb-stops::-webkit-scrollbar { display: none; }
.tb-stop { flex: none; position: relative; width: 38px; height: 38px; border-radius: 12px; border: 2px solid transparent; cursor: pointer;
           background: var(--surface-2); font-size: 18px; display: grid; place-items: center; transition: transform .15s, background .2s, border-color .2s; padding: 0; }

/* 달리는 중 — 덜컹덜컹(기차는 살짝만) · 배기 연기 · 장소 이모지 뿅 · 날짜 띠 */

@keyframes rumble { 0%, 100% { translate: 0 0; rotate: 0deg; } 30% { translate: 0 -2px; rotate: -3deg; } 70% { translate: 0 -1px; rotate: 2deg; } }

.day-banner { position: absolute; z-index: 3; pointer-events: none; font-style: normal; white-space: nowrap;

@keyframes banner { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
                    25%, 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; } }
.tb-stop.boing { animation: boing .5s ease; }
@keyframes boing { 30% { scale: 1.35; rotate: -8deg; } 60% { scale: .95; rotate: 4deg; } 100% { scale: 1; rotate: 0deg; } }
.pin.pulse { animation: pinpulse .9s ease; }
@keyframes pinpulse { 0% { box-shadow: 0 0 0 0 var(--c); transform: scale(1); } 40% { transform: scale(1.35); }
                      100% { box-shadow: 0 0 0 16px transparent; transform: scale(1); } }
.maplibregl-popup-content { font-family: inherit; font-size: 13px; border-radius: 12px; padding: 10px 12px; }
.route-list { padding: 6px 0; overflow: hidden; }
.route-day { font-size: 12px; font-weight: 800; color: var(--muted); padding: 12px 16px 6px; letter-spacing: .02em; }
.stop { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; }
.stop:active { background: var(--surface-2); }
.stop .num { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; flex: none; }

.fab { position: fixed; right: 20px; bottom: calc(94px + var(--safe-b)); z-index: 21; width: 58px; height: 58px; border: 0;

       transition: transform .15s ease; }

/* ─────────────────────────────────────────────────────────────

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 15, 20, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
         background: var(--surface); border-radius: 26px 26px 0 0; padding: 8px 20px calc(20px + var(--safe-b));
         transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); max-height: 92dvh; overflow-y: auto; }
.sheet.open { transform: none; }
.handle { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 2px; }
.field input, .field select, .field textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);

  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); background: var(--surface); }

.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
                      box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
.switch input:checked + span { background: var(--ok); }

.actions { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; border: 0; border-radius: 16px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; }

/* ─────────────────────────────────────────────────────────────
   잠금 화면 · 토스트
   ───────────────────────────────────────────────────────────── */
.lock { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden; color: #fff;
        padding: calc(24px + var(--safe-t)) 22px calc(24px + var(--safe-b)); background: #05313a;
        transition: opacity .45s ease, transform .45s ease; }
.lock[hidden] { display: none; }
.lock.leave { opacity: 0; transform: scale(1.05); pointer-events: none; }

/* 배경 — 천천히 떠다니는 빛 덩어리 + 물결 */
.blob { position: absolute; border-radius: 50%; filter: blur(64px); will-change: transform; }
.blob.b1 { width: 400px; height: 400px; background: #14b8a6; top: -140px; left: -120px; opacity: .8; animation: drift1 14s ease-in-out infinite alternate; }
.blob.b2 { width: 340px; height: 340px; background: #38bdf8; top: 22%; right: -160px; opacity: .65; animation: drift2 17s ease-in-out infinite alternate; }
.blob.b3 { width: 320px; height: 320px; background: #fb7185; bottom: -100px; left: 6%; opacity: .42; animation: drift3 19s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(90px, 130px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-100px, 90px) scale(.88); } }
@keyframes drift3 { to { transform: translate(100px, -80px) scale(1.2); } }
.waves { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none; }
.waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
.waves .w1 { opacity: .16; animation: wave 14s linear infinite; }
.waves .w2 { opacity: .10; height: 80%; animation: wave 9s linear infinite reverse; }
@keyframes wave { to { transform: translateX(-50%); } }

/* 가운데 */
.lock-box { position: relative; width: 100%; max-width: 360px; text-align: center; }
.badge-ico { width: 108px; height: 108px; margin: 0 auto 20px; border-radius: 36px; display: grid; place-items: center; font-size: 58px;
             background: linear-gradient(145deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .06));
             border: 1px solid rgba(255, 255, 255, .32); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
             box-shadow: 0 22px 50px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .45);
             animation: bob 4.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px) rotate(-3deg); } }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .3em; opacity: .7; }
.lock h2 { margin: 6px 0 8px; font-size: 40px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.1;
           background: linear-gradient(180deg, #ffffff 30%, #bff7ea 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lock p { margin: 0 0 28px; opacity: .78; font-size: 15px; }

/* 유리 카드 — 암호 입력 + 들어가기 */
.glass { padding: 8px; border-radius: 28px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22);

         box-shadow: 0 26px 60px rgba(0, 0, 0, .28); }
.pw { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 6px 0 18px; border-radius: 21px;

.pw:focus-within { background: rgba(0, 0, 0, .28); box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }

.eye { width: 46px; height: 46px; flex: none; border: 0; background: transparent; color: #fff; opacity: .75;
       border-radius: 14px; display: grid; place-items: center; cursor: pointer; }
.eye:active { background: rgba(255, 255, 255, .12); }
.eye .off { display: none; }
.eye.on .on { display: none; } .eye.on .off { display: block; }
.go { width: 100%; height: 60px; margin-top: 8px; border: 0; border-radius: 21px; cursor: pointer;
      background: #fff; color: #075e6b; font-size: 17px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .18); transition: transform .12s ease; }
.go:active { transform: scale(.98); }
.go.loading { pointer-events: none; }
.go.loading > * { display: none; }
.go.loading::after { content: ""; width: 22px; height: 22px; border-radius: 50%;
                     border: 3px solid rgba(7, 94, 107, .2); border-top-color: #075e6b; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.lock .err { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 600; }
.lock .err:not(:empty) { padding: 8px 16px; border-radius: 99px; background: rgba(255, 92, 80, .22); border: 1px solid rgba(255, 150, 140, .45); }
.lock .foot { margin-top: 18px; font-size: 12px; opacity: .5; }
@media (prefers-reduced-motion: reduce) { .blob, .waves svg, .badge-ico { animation: none; } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
/* ─────────────────────────────────────────────────────────────
   응원하기 · 버그 신고
   ───────────────────────────────────────────────────────────── */
.hero-actions { display: flex; gap: 8px; margin-top: 14px; position: relative; z-index: 1; flex-wrap: wrap; }
.hero-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 99px; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .16); color: #fff;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 13px; font-weight: 700; transition: transform .12s ease; }
.hero-btn:active { transform: scale(.93); }
.hero-btn b { min-width: 22px; padding: 1px 8px; border-radius: 99px; background: #fff; color: #e0435a;
              font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.heart { display: inline-block; }
.cheer.pop .heart { animation: heart .45s ease; }
@keyframes heart { 30% { transform: scale(1.7) rotate(-14deg); } 65% { transform: scale(.9); } }
.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.4); } }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.balloon { position: fixed; bottom: -90px; z-index: 79; pointer-events: none; animation: rise 3s ease-in forwards; }
@keyframes rise {
  0%   { transform: translate(0, 0) rotate(-6deg); }
  50%  { transform: translate(16px, -55vh) rotate(7deg); }
  100% { transform: translate(-12px, -118vh) rotate(-4deg); }
}
.plus1 { position: fixed; z-index: 81; pointer-events: none; font-size: 24px; font-weight: 900; color: #ff4d6d;
         text-shadow: 0 2px 10px rgba(0, 0, 0, .18); transform: translate(-50%, -50%); animation: up .9s ease-out forwards; }
@keyframes up { to { transform: translate(-50%, -190%) scale(1.35); opacity: 0; } }
.sheet-sub { margin: -8px 0 16px; color: var(--muted); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); z-index: 70; transform: translate(-50%, 20px);
         background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 700;
         opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; }

<body>

<header class="hero">

  </button>

  </button>

    <svg class="w2" viewBox="0 0 2880 130" preserveAspectRatio="none"><path fill="#fff" d="M0 70 Q180 110 360 70 T720 70 T1080 70 T1440 70 T1800 70 T2160 70 T2520 70 T2880 70 V130 H0Z"/></svg>

    <div class="glass">
      <label class="pw">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        <input id="lockInput" type="password" placeholder="여행 암호" autocomplete="current-password" enterkeyhint="go" autocapitalize="off" spellcheck="false">
        <button type="button" class="eye" id="eye" aria-label="암호 보기">
          <svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// 설정 — Supabase 프로젝트의 URL 과 publishable(anon) key. 공개용 키라 페이지에 있어도 된다.
// 비워 두면 데모 모드(이 브라우저에만 저장)로 동작한다.
// secret(service_role) 키는 절대 넣지 않는다.
// ─────────────────────────────────────────────────────────────
const CONFIG = {
  SUPABASE_URL: "https://yijkbqygdiscaunzhrvy.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_kymzTMwNQpia-oz05r63Qg_4AaR1NJo",
};
const TABLE = "trip_items";
const PASS_KEY = "geoje-trip-pass";   // 브라우저에 기억하는 여행 암호
const DEMO_KEY = "geoje-trip-demo";   // 데모 모드 저장소
const TAB_KEY = "geoje-trip-tab";
const DEVICE_KEY = "geoje-trip-device";

// 저장소 — Supabase 또는 데모(localStorage)
// ─────────────────────────────────────────────────────────────
const remote = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let client = null;

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }
function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

// 기기 ID — 사람은 구분하지 않고, 기록은 기기 단위로만 남긴다
function deviceId() {
  let d = lsGet(DEVICE_KEY);
  if (!d) {
    d = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 18);
    lsSet(DEVICE_KEY, d);
  }
  return d;
}

let currentPass = null;
function connect(pass) {
  // 여행 암호는 x-trip-key 헤더로 보내고, DB 의 RLS 정책이 이 값을 검사한다.
  // x-trip-device 는 DB 가 접속 로그 · 수정 내역 · 응원에 기본값으로 채운다
  currentPass = pass;
  const headers = { "x-trip-key": pass, "x-trip-device": deviceId() };
  client = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: false },
    global: { headers },
  });
}

async function logVisit() {
  if (!remote || !client) return;
  try { await client.from("trip_visits").insert({ page: "main" }); } catch (e) {}
}

const store = {
  async checkPass() {
    const { data, error } = await client.rpc("trip_key_ok");
    if (error) throw error;
    return data === true;
  },
  async slots() {
    if (!remote) return [];
    const { data, error } = await client.from("trip_slots").select("*").order("day").order("time");
    if (error) throw error;
    return data;
  },
  async options() {
    if (!remote) return [];
    const { data, error } = await client.from("trip_options").select("*").order("sort").order("id");
    if (error) throw error;
    return data;
  },
  async setChosen(slotId, optionId) {
    const { error } = await client.from("trip_slots").update({ chosen_id: optionId }).eq("id", slotId);
    if (error) throw error;
  },
  async addOption(row) {
    const { error } = await client.from("trip_options").insert(row);
    if (error) throw error;
  },
  async removeOption(id) {
    await client.from("trip_slots").update({ chosen_id: null }).eq("chosen_id", id);   // 고른 후보였으면 선택도 푼다
    const { error } = await client.from("trip_options").delete().eq("id", id);
    if (error) throw error;
  },
  async places(categories) {
    if (!remote) return [];
    const { data, error } = await client.from("trip_places")
      .select("id,name,category,area,menu,memo,badge,source_url,photo_url,lat,lng").in("category", categories).order("name");
    if (error) throw error;
    return data;
  },
  async people() {
    if (!remote) return [];
    const { data, error } = await client.from("trip_people").select("name,photo,sort").order("sort");
    if (error) throw error;
    return data;
  },
  async list() {
    if (!remote) return JSON.parse(lsGet(DEMO_KEY) || "[]");
    const { data, error } = await client.from(TABLE).select("*").order("created_at");
    if (error) throw error;
    return data;
  },
  async insert(row) {
    if (!remote) {
      const all = await store.list();
      all.push({ ...row, id: Date.now(), created_at: new Date().toISOString() });
      return lsSet(DEMO_KEY, JSON.stringify(all));
    }
    const { error } = await client.from(TABLE).insert(row);
    if (error) throw error;
  },
  async update(id, patch) {
    if (!remote) {
      const all = (await store.list()).map(r => r.id === id ? { ...r, ...patch } : r);
      return lsSet(DEMO_KEY, JSON.stringify(all));
    }
    const { error } = await client.from(TABLE).update(patch).eq("id", id);
    if (error) throw error;
  },
  async remove(id) {
    if (!remote) return lsSet(DEMO_KEY, JSON.stringify((await store.list()).filter(r => r.id !== id)));
    const { error } = await client.from(TABLE).delete().eq("id", id);
    if (error) throw error;
  },
};

// 사람 이름 → 고정 색
const HUES = [186, 12, 262, 145, 35, 330, 210];
function whoColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${HUES[h % HUES.length]} 62% 48%)`;
}
// 프로필 사진이 있으면 사진, 없으면 첫 글자 동그라미

  const ph = photoOf(name);
  return ph ? `<img class="who" src="${ph}" alt="${esc(name)}">`
            : `<span class="who" style="background:${whoColor(name)}">${esc(String(name).slice(0, 1))}</span>`;
};

function renderHero() {
  const days = [...new Set(byKind("schedule").map(r => r.day).filter(Boolean))].sort();
  const parts = [];
  if (days.length) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const first = new Date(days[0] + "T00:00:00"), last = new Date(days[days.length - 1] + "T00:00:00");
    const diff = Math.round((first - today) / 86400000);
    const label = diff > 0 ? `D-${diff}` : today <= last ? "여행 중 ✨" : "다녀왔어요";
    parts.push(`<span class="dday">${label}</span>`);
    const f = d => `${d.getMonth() + 1}.${d.getDate()}`;
    parts.push(days.length > 1 ? `${f(first)} – ${f(last)}` : f(first));
  }
  const total = slots.filter(s => !s.fixed).length;
  parts.push(total ? `${slots.filter(s => !s.fixed && s.chosen_id).length}/${total} 정함 · 준비물 ${byKind("check").length}`
                   : `일정 ${byKind("schedule").length} · 준비물 ${byKind("check").length}`);
  $("#heroSub").innerHTML = parts.join("<span style='opacity:.5'>·</span>");
  $("#crew").innerHTML = people.length
    ? `<div class="crew-faces">${people.map(p => who(p.name)).join("")}</div>
       <span class="crew-txt">${people.map(p => esc(p.name)).join(" · ")}</span>`
    : "";
}

  if (/place\.naver|naver\.me|map\.naver/.test(url)) return "네이버";

// 세부 항목 — 줄바꿈으로 나눈 메모를 «아이콘 + 글» 줄로 그린다.
// 줄바꿈이 없는 옛 메모는 « · » 로 나누고, 앞에 이모지가 없으면 낱말을 보고 아이콘을 붙인다.
const MEMO_IC = [
  [/금연/, "🚭"], [/반려/, "🐶"], [/금지/, "🚫"], [/비 오면|우천/, "☔"], [/주차/, "🅿️"],
  [/\d{2,4}-\d{3,4}-\d{4}/, "📞"], [/휴무/, "📅"], [/\d\s*(만\s*)?원|결제/, "💰"],
  [/기차|KTX|무궁화|환승/, "🚄"], [/차로|운전|거가대교/, "🚗"], [/걸어|도보|산책/, "🚶"],
  [/\d{1,2}:\d{2}|체크인|체크아웃|퇴실|오픈/, "⏰"], [/(로|길)\s?\d/, "📍"], [/리뷰/, "⭐"],
];
const LEAD_EMOJI = /^(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*️?)\s*/u;
const openFolds = new Set();   // 펼친 카드 — 다시 그려도 펼친 채로 둔다

function memoRows(memo) {
  const text = String(memo || "").trim();
  if (!text) return [];
  // 한 줄 메모는 이모지로 시작하면 그대로 한 줄, 아니면 « · » 가 셋 이상일 때만 나눈다
  const dots = text.split(/\s+·\s+/);
  const parts = text.includes("\n") ? text.split(/\n+/)
    : !LEAD_EMOJI.test(text) && dots.length >= 3 ? dots : [text];
  return parts.map(t => t.trim()).filter(Boolean).map(t => {
    const m = t.match(LEAD_EMOJI);
    if (m) return { ic: m[1], t: t.slice(m[0].length) };
    const hit = MEMO_IC.find(([re]) => re.test(t));
    return { ic: hit ? hit[1] : "💬", t };
  });
}

function memoHTML(memo, key) {
  const rows = memoRows(memo);
  if (!rows.length) return "";
  const li = list => list.map(r => `<li><i>${esc(r.ic)}</i><span>${esc(r.t)}</span></li>`).join("");
  // 세 줄까지는 다 보이고, 넘으면 두 줄만 보이고 나머지는 «더보기»
  if (rows.length <= 3) return `<ul class="memo">${li(rows)}</ul>`;
  return `<div class="memo-box${openFolds.has(key) ? " open" : ""}" data-fold="${esc(key)}">
    <ul class="memo">${li(rows.slice(0, 2))}</ul><ul class="memo memo-more">${li(rows.slice(2))}</ul>
    <button type="button" class="fold-btn" data-fold-btn><span class="more">더보기 +${rows.length - 2}</span><span class="less">접기</span><span class="chev">▾</span></button></div>`;
}

// 대표 사진 — 없거나 못 불러오면 아이콘 카드가 보인다(외부 사이트 사진은 리퍼러 없이 불러온다)
function thumb(o, cls, ic) {
  return `<div class="ph ${cls}"><span>${ic}</span>${o.photo_url
    ? `<img src="${esc(o.photo_url)}" alt="" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div>`;
}

function slotCard(s) {
  const opts = optionsOf(s.id), picked = chosenOf(s);
  const head = `<div class="slot-h"><span class="slot-ic">${slotIcon(s)}</span><span class="slot-t">${esc(s.title)}</span>
    <span class="slot-st${picked ? " ok" : ""}">${s.fixed ? "고정" : picked ? "✓ 정했어요" : `후보 ${opts.length}곳`}</span></div>`;
  let body;
  if (s.fixed) {
    body = s.photo_url ? thumb(s, "big", slotIcon(s)) : "";
  } else if (picked) {
    body = `<div class="pick-card">${thumb(picked, "big", slotIcon(s))}
      <div class="pick-title">${esc(picked.title)}${badge(picked.badge)}</div>
      ${picked.area ? `<div class="pick-sub">📍 ${esc(picked.area)}</div>` : ""}
      ${picked.menu ? `<div class="pick-menu">${esc(picked.menu)}</div>` : ""}
      <div class="place-act">${mapLinks(picked)}<span class="swap">바꾸기 ›</span></div></div>`;
  } else {
    body = `<div class="cands">${opts.map(o => `<span class="cand">${thumb(o, "mini", slotIcon(s))}${esc(o.title)}${o.badge === "블루리본" ? " 💙" : o.badge === "주신 곳" ? " ⭐" : ""}</span>`).join("")}</div>
      <div class="slot-hint">눌러서 하나 골라 주세요 👆</div>`;
  }
  return `<div class="slot card press${s.fixed ? " fixed" : ""}${picked ? " done" : ""}" data-slot="${s.id}">${head}${body}
    ${memoHTML(s.memo, "s" + s.id)}</div>`;
}

function renderSchedule() {
  // 일반 일정(기차 등)과 슬롯을 한 타임라인에 시간순으로
  const rows = [
    ...byKind("schedule").map(r => ({ type: "item", day: r.day, time: r.time, r })),
    ...slots.map(s => ({ type: "slot", day: s.day, time: s.time, s })),
  ].sort((a, b) => (a.day || "9999").localeCompare(b.day || "9999") || (a.time || "99").localeCompare(b.time || "99"));

  const total = choosable().length, done = choosable().filter(s => s.chosen_id).length;
  let html = `<div class="sec-h"><h2>일정</h2><span class="meta">${total ? `${done}/${total} 정함` : `${rows.length}개`}</span></div>`;
  if (!rows.length) return html + empty("🗓️", "아직 일정이 없어요", "아래 + 버튼으로 첫 일정을 넣어 보세요");
  if (total) html += `<div class="plan-bar card"><div class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></div>
    <span>${done === total ? "다 정했어요 🎉" : `끼니 · 카페 ${total - done}곳 남았어요`}</span></div>`;

  const dayIndex = [...new Set(rows.map(r => r.day).filter(Boolean))];
  let cur = undefined;
  for (const row of rows) {
    if (row.day !== cur) {
      if (cur !== undefined) html += `</section>`;
      cur = row.day;
      const n = cur ? `DAY ${dayIndex.indexOf(cur) + 1}` : "미정";
      html += `<section><div class="day-h"><span class="day-n">${n}</span><span class="d">${dayLabel(cur)}</span></div>`;
    }
    const time = esc((row.time || "").slice(0, 5)) || "–";
    if (row.type === "slot") {
      const c = (SLOT[row.s.kind] || SLOT.meal).c;
      html += `<div class="tl fade-in"><div class="tl-time">${time}</div><div class="tl-rail" style="--dot:${c}"></div>${slotCard(row.s)}</div>`;
      continue;
    }
    const r = row.r;
    html += `<div class="tl fade-in">
      <div class="tl-time">${time}</div><div class="tl-rail"></div>
      <div class="tl-card card press" data-id="${esc(r.id)}">${r.photo_url ? thumb(r, "big", "🏠") : ""}<b>${esc(r.title)}</b>
        ${memoHTML(r.memo, "i" + r.id)}
        ${r.url ? `<div class="place-act"><a class="pill ghost" href="${esc(r.url)}" target="_blank" rel="noopener" data-stop>${ICON.link}링크</a></div>` : ""}
      </div></div>`;
  }
  return html + `</section>`;
}

// 슬롯 시트 — 후보를 누르면 바로 정해진다
function openSlot(s) {
  if (s.fixed) return toast(`${slotIcon(s)} 이미 정해진 일정이에요`);
  const opts = optionsOf(s.id);
  const html = `<div class="handle"></div><h3>${slotIcon(s)} ${esc(s.title)} 고르기</h3>
    <p class="sheet-sub">${dayLabel(s.day)} ${esc((s.time || "").slice(0, 5))}</p>
    ${s.memo ? `<ul class="memo sheet-memo">${memoRows(s.memo).map(r => `<li><i>${esc(r.ic)}</i><span>${esc(r.t)}</span></li>`).join("")}</ul>` : ""}
    <div class="opts">${opts.map(o => `<div class="opt${o.id === s.chosen_id ? " on" : ""}" data-opt="${o.id}">
      <div class="opt-thumb">${thumb(o, "sq", slotIcon(s))}<span class="radio"></span></div>
      <div class="opt-main">
        <div class="opt-t">${esc(o.title)}${badge(o.badge)}</div>
        ${o.area || o.menu ? `<div class="opt-s">${esc([o.area, o.menu].filter(Boolean).join(" · "))}</div>` : ""}
        ${o.memo ? `<div class="opt-m">${esc(o.memo)}</div>` : ""}
        <div class="opt-act">${mapLinks(o)}<button type="button" class="icon-btn" data-optdel="${o.id}" aria-label="후보 빼기">✕</button></div>
      </div></div>`).join("") || `<div class="empty">아직 후보가 없어요</div>`}</div>
    <button type="button" class="add-opt" id="addOpt">+ 후보 추가</button>
    <div class="actions">${s.chosen_id ? `<button type="button" class="btn soft" id="unpick">선택 취소</button>` : ""}
      <button type="button" class="btn primary" id="sCancel">닫기</button></div>`;
  openPanel(html, () => {}, false);

  const sheet = $("#sheet");
  sheet.onclick = async e => {
    if (e.target.closest("[data-stop]")) return;
    const del = e.target.closest("[data-optdel]");
    if (del) {
      const o = options.find(x => String(x.id) === del.dataset.optdel);
      if (!confirm(`«${o.title}» 을(를) 후보에서 뺄까요?`)) return;
      options = options.filter(x => x.id !== o.id);
      if (s.chosen_id === o.id) s.chosen_id = null;
      openSlot(s); render();
      try { await store.removeOption(o.id); } catch (err) { fail(err); }
      return reload();
    }
    const pick = e.target.closest("[data-opt]");
    if (pick) {
      const o = options.find(x => String(x.id) === pick.dataset.opt);
      // 같은 곳을 다른 슬롯에서 이미 골랐으면 막는다
      const other = slots.find(x => x.id !== s.id && x.chosen_id && (chosenOf(x) || {}).title === o.title);
      if (other) return toast(`이미 ${shortDay(other.day)} ${other.title}에서 고른 곳이에요`);
      s.chosen_id = o.id;                       // 화면부터 바꾸고 저장한다
      closeSheet(); render(); vibrate();
      toast(`${slotIcon(s)} «${o.title}» 로 정했어요`);
      fx.burst(innerWidth / 2, innerHeight * .45, 50);
      try { await store.setChosen(s.id, o.id); } catch (err) { fail(err); }
      return reload();
    }
    if (e.target.closest("#unpick")) {
      s.chosen_id = null;
      closeSheet(); render();
      try { await store.setChosen(s.id, null); } catch (err) { fail(err); }
      return reload();
    }
    if (e.target.closest("#addOpt")) openPicker(s);
  };
}
