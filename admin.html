<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>거제 여행 · 관리자</title>
<meta name="theme-color" content="#0f1a1f">
<meta name="color-scheme" content="light only">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────────────────────
   토큰
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #f7f9fb; --surface: #fff; --surface-2: #f1f4f7; --text: #0f171c; --muted: #56656e;
  --line: rgba(15, 35, 45, .10); --brand: #0e7c86; --brand-soft: rgba(14, 124, 134, .1);
  --coral: #ff5a4e; --ok: #1fa37a; --amber: #e8a317; --violet: #7c5cff;
  --shadow: 0 1px 2px rgba(16, 40, 50, .04), 0 6px 20px rgba(16, 40, 50, .06);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
/* 폰이 다크 모드여도 늘 흰 테마로 보인다(사용자 요청, 2026-10-23) */
:root { color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em;
       font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
       -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* 머리 */
.top { background: linear-gradient(150deg, #0f1a1f 0%, #15303a 60%, #0e5560 100%); color: #fff;
       padding: calc(var(--safe-t) + 20px) 18px 64px; }
.top-in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .k { font-size: 12px; font-weight: 700; letter-spacing: .22em; opacity: .6; }
.top h1 { margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
.top .upd { font-size: 12px; opacity: .6; margin-top: 2px; }
.top-btns { display: flex; gap: 8px; }
.tbtn { border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .1); color: #fff; border-radius: 12px;
        padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:active { transform: scale(.96); }
.tbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { max-width: 960px; margin: -44px auto 0; padding: 0 14px calc(40px + var(--safe-b)); }

/* 요약 카드 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(6, 1fr); } }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.stat .l { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.stat .v { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat.hot .v { color: var(--coral); }

/* 탭 */
.seg { display: flex; gap: 4px; background: var(--surface); padding: 5px; border-radius: 16px; box-shadow: var(--shadow);
       position: sticky; top: calc(var(--safe-t) + 8px); z-index: 5; margin-bottom: 14px; overflow-x: auto; }
.seg button { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; border-radius: 12px; padding: 10px 4px;
              font-size: 12.5px; letter-spacing: -0.03em; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--text); color: var(--bg); }
.seg .n { font-size: 11px; opacity: .65; margin-left: 3px; }

/* 공통 목록 */
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); }
.card-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 6px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 800; }
.card-h .m { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 700; word-break: break-word; }
.row .s { font-size: 13px; color: var(--muted); word-break: break-word; }
.stat .v.txt { font-size: 18px; padding: 5px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.when b { display: block; color: var(--text); font-weight: 700; }
.who { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
       color: #fff; font-weight: 800; font-size: 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; margin-right: 6px; vertical-align: 1px; }
.b-insert { background: rgba(31, 163, 122, .14); color: var(--ok); }
.b-update { background: rgba(124, 92, 255, .14); color: var(--violet); }
.b-delete { background: rgba(255, 90, 78, .14); color: var(--coral); }
.b-kind { background: var(--surface-2); color: var(--muted); }
.diff { margin-top: 4px; display: grid; gap: 2px; font-size: 13px; }
.diff span { color: var(--muted); }
.diff del { color: var(--coral); text-decoration: line-through; }
.diff ins { color: var(--ok); text-decoration: none; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; }
.empty .e { font-size: 36px; display: block; margin-bottom: 6px; }
.more { width: 100%; border: 0; background: transparent; padding: 12px; color: var(--brand); font-weight: 700; cursor: pointer; border-top: 1px solid var(--line); }

/* 사람별 · 순위 */
.people { display: grid; gap: 0; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff8fab, #ff4d6d); }
.rank { width: 26px; font-weight: 800; color: var(--muted); text-align: center; padding-top: 6px; }
.big-cheer { text-align: center; padding: 22px 16px 18px; background: linear-gradient(145deg, #ff6f91, #ff9671); color: #fff; }
.big-cheer .v { font-size: 46px; font-weight: 900; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.big-cheer .l { font-size: 13px; opacity: .9; font-weight: 700; }

/* 문의 */
.filters { display: flex; gap: 6px; margin: 0 2px 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); }
.bug { padding: 14px 16px; }
.bug + .bug { border-top: 1px solid var(--line); }
.bug .cat { font-weight: 800; }
.bug .content { margin: 6px 0 8px; white-space: pre-wrap; word-break: break-word; }
.bug .meta { font-size: 12px; color: var(--muted); }
.bug.done { opacity: .55; }
.bug-act { display: flex; gap: 6px; margin-top: 10px; }
.abtn { border: 0; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-2); }
.abtn.ok { background: rgba(31, 163, 122, .14); color: var(--ok); }
.abtn.del { color: var(--coral); }
.new-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: 6px; vertical-align: 2px; }

/* 장소 DB */
.ptools { display: flex; gap: 8px; margin: 0 2px 10px; flex-wrap: wrap; align-items: center; }
.ptools input { flex: 1; min-width: 150px; height: 40px; padding: 0 12px; border-radius: 12px; border: 2px solid transparent;
                background: var(--surface); box-shadow: var(--shadow); color: var(--text); font: inherit; font-size: 15px; outline: none; }
.ptools input:focus { border-color: var(--brand); }
.place { padding: 13px 16px; }
.place::after { content: ""; display: block; clear: both; }
.pthumb { float: right; width: 64px; height: 64px; border-radius: 14px; object-fit: cover; margin: 0 0 6px 10px; background: var(--surface-2); }
.place + .place { border-top: 1px solid var(--line); }
.place-t { font-weight: 800; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.place-s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.place-m { font-size: 13px; margin-top: 3px; }
.links { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.lk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 99px;
      text-decoration: none; background: var(--brand); color: #fff; }
.lk.ghost { background: var(--surface-2); color: var(--text); }
.uses { font-size: 12px; color: var(--muted); }
.uses b { color: var(--ok); }
.bdg { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 7px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.bdg.blue { background: rgba(37, 99, 235, .12); color: #2563eb; }
.bdg.mine { background: rgba(234, 179, 8, .18); color: #b7791f; }
.bdg.season { background: rgba(14, 165, 164, .14); color: #0e8f8f; }
.bdg.app { background: rgba(124, 92, 255, .14); color: var(--violet); }
.padd { padding: 14px 16px; display: grid; gap: 8px; }
.padd .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.padd input, .padd select { height: 44px; padding: 0 12px; border-radius: 12px; border: 2px solid transparent; background: var(--surface-2);
                            color: var(--text); font: inherit; font-size: 15px; outline: none; width: 100%; }
.padd input:focus, .padd select:focus { border-color: var(--brand); }

/* 설정 — 암호 */
.set-body { padding: 4px 16px 16px; }
.cur { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.cur code { font-family: inherit; font-size: 20px; font-weight: 800; letter-spacing: .04em;
            background: var(--surface-2); padding: 8px 14px; border-radius: 12px; }
.set-form { display: flex; gap: 8px; flex-wrap: wrap; }
.set-form input { flex: 1; min-width: 140px; height: 46px; padding: 0 12px; border-radius: 12px; outline: none;
                  border: 2px solid transparent; background: var(--surface-2); color: var(--text); font: inherit; font-size: 16px; }
.set-form input:focus { border-color: var(--brand); background: var(--surface); }
.set-form .abtn { height: 46px; padding: 0 18px; }
.hint { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); z-index: 60; transform: translate(-50%, 16px);
         background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 700;
         opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 잠금 */
.lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; color: #fff;
        background: radial-gradient(120% 80% at 80% 0%, #1f5e68 0%, transparent 60%), #0b1418; }
.lock[hidden] { display: none; }
.lock form { width: 100%; max-width: 340px; text-align: center; }
.lock .e { font-size: 52px; }
.lock h2 { margin: 10px 0 4px; font-size: 26px; font-weight: 800; }
.lock p { margin: 0 0 22px; opacity: .65; font-size: 14px; }
.lock input { width: 100%; height: 56px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08); color: #fff;
              border-radius: 16px; padding: 0 16px; font: inherit; font-size: 17px; outline: none; text-align: center; letter-spacing: .06em; }
.lock input:focus { border-color: rgba(255, 255, 255, .5); }
.lock button { width: 100%; height: 56px; margin-top: 10px; border: 0; border-radius: 16px; background: #fff; color: #0f1a1f;
               font-size: 16px; font-weight: 800; cursor: pointer; }
.lock .err { min-height: 20px; margin-top: 12px; color: #ffb4a8; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <div class="k">GEOJE TRIP · ADMIN</div>
      <h1>관리자 화면</h1>
      <div class="upd" id="upd">불러오는 중</div>
    </div>
    <div class="top-btns">
      <button class="tbtn" id="refresh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>새로고침</button>
      <button class="tbtn" id="logout">나가기</button>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <nav class="seg" id="seg">
    <button data-tab="visits">접속 로그</button>
    <button data-tab="audit">수정 내역</button>
    <button data-tab="cheers">응원</button>
    <button data-tab="bugs">문의</button>
    <button data-tab="places">장소</button>
    <button data-tab="settings">설정</button>
  </nav>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>

<div class="lock" id="lock" hidden>
  <form id="lockForm">
    <div class="e">🛠️</div>
    <h2>관리자 전용</h2>
    <p>관리자 암호를 입력해 주세요</p>
    <input id="lockInput" type="password" placeholder="관리자 암호" autocomplete="current-password" autocapitalize="off">
    <button>들어가기</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// 설정 — index.html 과 같은 프로젝트. 읽기는 관리자 암호(x-admin-key)를 RLS 가 검사한다
// ─────────────────────────────────────────────────────────────
const CONFIG = {
  SUPABASE_URL: "https://yijkbqygdiscaunzhrvy.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_kymzTMwNQpia-oz05r63Qg_4AaR1NJo",
};
const KEY = "geoje-admin-key";
const TAB_KEY = "geoje-admin-tab";
const LIMIT = 1000;

let client = null;
let data = { visits: [], audit: [], cheers: [], bugs: [], cheerTotal: 0 };
let tab = localGet(TAB_KEY) || "visits";
let bugFilter = "new";
const shown = { visits: 50, audit: 50, cheers: 30 };

function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function localDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function connect(key) {
  client = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: false },
    global: { headers: { "x-admin-key": key } },
  });
}

// ─────────────────────────────────────────────────────────────
// 표시 도우미 — 시간 · 기기 · 사람 색
// ─────────────────────────────────────────────────────────────
const WEEK = "일월화수목금토";
function rel(ts) {
  const s = Math.round((Date.now() - new Date(ts)) / 1000);
  return s < 60 ? "방금" : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전`;
}
function when(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  const abs = `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `<div class="when"><b>${rel(ts)}</b>${abs}</div>`;
}
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();

function device(ua) {
  ua = ua || "";
  const os = /iPhone|iPad|iPod/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows"
           : /Mac OS/.test(ua) ? "Mac" : "기타";
  const br = /KAKAOTALK/i.test(ua) ? "카카오톡" : /NAVER/.test(ua) ? "네이버앱" : /SamsungBrowser/.test(ua) ? "삼성인터넷"
           : /Edg\//.test(ua) ? "Edge" : /CriOS|Chrome/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : /Firefox/.test(ua) ? "Firefox" : "브라우저";
  return `${os} · ${br}`;
}

const HUES = [186, 12, 262, 145, 35, 330, 210];
function color(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${HUES[h % HUES.length]} 62% 48%)`;
}
const personOf = r => r.name || (r.device_id ? "익명 " + r.device_id.slice(0, 4) : "익명");
let photos = {};   // 이름 → 프로필 사진(trip_people)
let optNames = {}; // 후보 id → 이름(수정 내역의 «고른 곳» 표시용)
const avatar = name => photos[name]
  ? `<img class="who" src="${photos[name]}" alt="${esc(name)}" style="object-fit:cover">`
  : `<span class="who" style="background:${color(name)}">${esc(String(name).slice(0, 1))}</span>`;
const KIND = { schedule: "일정", place: "장소", check: "준비물", expense: "경비", member: "인원", setting: "설정",
               meal: "끼니", cafe: "카페", bbq: "바베큐", spot: "구경", shop: "장보기", option: "후보" };
const FIELD = { title: "제목", day: "날짜", time: "시간", memo: "메모", url: "링크", category: "분류", person: "담당", done: "챙김", amount: "금액",
                chosen_id: "고른 곳", area: "지역", menu: "메뉴" };

function empty(e, t) { return `<div class="card"><div class="empty"><span class="e">${e}</span>${t}</div></div>`; }
function more(key, total) {
  return total > shown[key] ? `<button class="more" data-more="${key}">더 보기 (${total - shown[key]}개 남음)</button>` : "";
}

// ─────────────────────────────────────────────────────────────
// 요약
// ─────────────────────────────────────────────────────────────
function renderStats() {
  const v = data.visits;
  const people = new Set(v.map(personOf));
  const newBugs = data.bugs.filter(b => b.status === "new").length;
  const cards = [
    ["👀", "오늘 접속", v.filter(r => isToday(r.created_at)).length, `전체 ${v.length}`],
    ["📱", "들어온 기기", people.size, "기기 기준"],
    ["✏️", "수정", data.audit.length, `오늘 ${data.audit.filter(r => isToday(r.created_at)).length}`],
    ["💖", "응원", data.cheerTotal.toLocaleString("ko-KR"), `오늘 ${data.cheers.filter(r => isToday(r.created_at)).length}`],
    ["🐞", "새 문의", newBugs, `전체 ${data.bugs.length}`, newBugs > 0],
    ["🕒", "마지막 접속", v[0] ? personOf(v[0]) : "–", v[0] ? rel(v[0].created_at) : ""],
  ];
  $("#stats").innerHTML = cards.map(([e, l, val, s, hot]) =>
    `<div class="stat${hot ? " hot" : ""}"><div class="l">${e} ${l}</div>
      <div class="v${/^[\d,]+$/.test(String(val)) ? "" : " txt"}">${esc(val)}</div><div class="s">${esc(s)}</div></div>`).join("");
  const counts = { visits: v.length, audit: data.audit.length, cheers: data.cheerTotal, bugs: newBugs, places: (data.places || []).length };
  document.querySelectorAll("#seg button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === tab);
    const n = counts[b.dataset.tab];
    b.innerHTML = b.textContent.replace(/\s*[\d,]+$/, "") + (n === undefined ? "" : `<span class="n">${n}</span>`);
  });
}

// ─────────────────────────────────────────────────────────────
// 접속 로그 — 사람별 요약 + 시간순
// ─────────────────────────────────────────────────────────────
function renderVisits() {
  const v = data.visits;
  if (!v.length) return empty("👀", "아직 접속 기록이 없어요");
  const by = new Map();
  for (const r of v) {
    const k = personOf(r);
    if (!by.has(k)) by.set(k, { n: 0, last: r, devices: new Set() });
    const g = by.get(k);
    g.n++;
    g.devices.add(device(r.user_agent));
  }
  let html = `<div class="card"><div class="card-h"><h3>사람별</h3><span class="m">${by.size}명</span></div><div class="people">`;
  for (const [name, g] of by) {
    html += `<div class="row">${avatar(name)}<div class="main"><div class="t">${esc(name)}</div>
      <div class="s">${g.n}번 접속 · ${esc([...g.devices].join(", "))}</div></div>${when(g.last.created_at)}</div>`;
  }
  html += `</div></div><div class="card"><div class="card-h"><h3>접속 기록</h3><span class="m">최근 ${Math.min(v.length, LIMIT)}건</span></div>`;

      <div class="s">${esc(device(r.user_agent))} · ${esc(r.ip || "IP 없음")}${r.country ? " · " + esc(r.country) : ""}</div></div>${when(r.created_at)}</div>`;

}

// ─────────────────────────────────────────────────────────────
// 수정 내역 — 무엇이 어떻게 바뀌었는지
// ─────────────────────────────────────────────────────────────
function show(k, v) {
  if (v === null || v === undefined || v === "") return "(비어 있음)";
  if (k === "done") return v ? "챙김" : "안 챙김";
  if (k === "time") return String(v).slice(0, 5);
  if (k === "chosen_id") return optNames[v] || `후보 #${v}`;
  return String(v);
}

function diff(r) {
  const a = r.before || {}, b = r.after || {};
  if (r.action !== "update") {
    const src = r.action === "insert" ? b : a;
    const keys = Object.keys(FIELD).filter(k => k !== "title" && src[k] !== null && src[k] !== undefined && src[k] !== "" && !(k === "done" && !src[k]));
    return keys.map(k => `<div><span>${FIELD[k]}</span> ${esc(show(k, src[k]))}</div>`).join("");
  }
  return Object.keys(FIELD).filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]))
    .map(k => `<div><span>${FIELD[k]}</span> <del>${esc(show(k, a[k]))}</del> → <ins>${esc(show(k, b[k]))}</ins></div>`).join("");
}

function renderCheers() {

      <div class="bar"><i style="width:${Math.max(4, n / top * 100)}%"></i></div></div></div>`;

// ─────────────────────────────────────────────────────────────
// 장소 DB — 주신 곳 · 웹 검색 · 앱에서 추가한 곳. 지도 링크는 늘, 출처 링크는 있으면

let placeCat = "전체", placeSrc = "전체", placeQ = "";
const CAT_IC = { 맛집: "🍽️", 카페: "☕", 구경: "📸", 숙소: "🏠", 마트: "🛒" };

function srcLabel(url) {
  if (!url) return "";
  if (/map\.kakao|kko\.to/.test(url)) return "🗺️ 카카오맵";
  if (/place\.naver|naver\.me|map\.naver/.test(url)) return "🟢 네이버";
  if (/youtube|youtu\.be/.test(url)) return "▶ 유튜브";
  if (/blog|brunch|keyzard|tistory|click1-tip/.test(url)) return "📝 블로그";
  if (/siksinhot/.test(url)) return "식신";
  if (/diningcode/.test(url)) return "다이닝코드";
  if (/x\.com|threads|instagram/.test(url)) return "SNS";
  if (/koreacharts|visitkorea/.test(url)) return "관광공사";
  if (/fmkorea|clien|tripade/.test(url)) return "💬 커뮤니티";
  return "🔗 출처";
}

function pbadge(b, cls) {
  if (!b) return "";
  const c = cls || (b === "블루리본" ? "blue" : b.includes("제철") ? "season" : "");
  const label = b === "블루리본" ? "💙 블루리본" : b;
  return `<span class="bdg ${c}">${esc(label)}</span>`;
}

// 이 장소가 어느 슬롯 후보인지 · 골랐는지
function usesOf(name) {
  const opts = (data.options || []).filter(o => o.title === name);
  return opts.map(o => {
    const s = (data.slots || []).find(x => x.id === o.slot_id);
    if (!s) return "";
    const d = new Date(s.day + "T00:00:00");
    const label = `${d.getMonth() + 1}/${d.getDate()} ${s.title}`;
    return s.chosen_id === o.id ? `<b>✓ ${esc(label)}</b>` : esc(label);
  }).filter(Boolean);
}

function renderPlaces() {
  const all = data.places || [];
  const q = placeQ.toLowerCase();
  const CAT_ORDER = ["숙소", "맛집", "카페", "구경", "마트"], SRC_ORDER = ["주신 곳", "앱에서 추가", "관리자 추가", "웹 검색"];
  const rank = p => [CAT_ORDER.indexOf(p.category), SRC_ORDER.indexOf(p.source), p.badge === "블루리본" ? 0 : 1];
  const rows = all.filter(p => (placeCat === "전체" || p.category === placeCat)
    && (placeSrc === "전체" || p.source === placeSrc)
    && (!q || [p.name, p.area, p.menu, p.memo].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => {
      const x = rank(a), y = rank(b);
      return x[0] - y[0] || x[1] - y[1] || x[2] - y[2] || a.name.localeCompare(b.name, "ko");
    });
  const count = (k, v) => all.filter(p => p[k] === v).length;
  const chip = (group, v, n) => `<button class="chip${(group === "cat" ? placeCat : placeSrc) === v ? " on" : ""}" data-p${group}="${v}">${v === "전체" ? "전체" : (CAT_IC[v] || "") + " " + v} ${n}</button>`;

  let html = `<div class="filters">${["전체", "숙소", "맛집", "카페", "구경", "마트"].filter(c => c === "전체" || count("category", c)).map(c => chip("cat", c, c === "전체" ? all.length : count("category", c))).join("")}</div>
    <div class="filters">${["전체", "주신 곳", "웹 검색", "앱에서 추가", "관리자 추가"].filter(s => s === "전체" || count("source", s))
      .map(s => chip("src", s, s === "전체" ? all.length : count("source", s))).join("")}</div>
    <div class="ptools"><input id="pq" placeholder="이름 · 지역 · 메뉴 검색" value="${esc(placeQ)}"><button class="abtn ok" id="padd">+ 장소 추가</button></div>
    <div id="paddBox"></div>`;
  if (!rows.length) return html + empty("🧭", "조건에 맞는 장소가 없어요");

  html += `<div class="card">`;
  for (const p of rows) {
    const uses = usesOf(p.name);
    html += `<div class="place">
      ${p.photo_url ? `<img class="pthumb" src="${esc(p.photo_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="place-t">${CAT_IC[p.category] || "📍"} ${esc(p.name)}${p.badge === "주신 곳" ? "" : pbadge(p.badge)}${p.source === "주신 곳" ? pbadge("⭐ 미리 찜", "mine") : p.source === "앱에서 추가" ? pbadge("앱에서 추가", "app") : ""}</div>
      ${p.area || p.menu ? `<div class="place-s">${esc([p.area, p.menu].filter(Boolean).join(" · "))}</div>` : ""}
      ${p.memo ? `<div class="place-m">${esc(p.memo)}</div>` : ""}
      <div class="links"><a class="lk" href="${esc(p.map_url)}" target="_blank" rel="noopener">📍 지도</a>
        ${p.source_url ? `<a class="lk ghost" href="${esc(p.source_url)}" target="_blank" rel="noopener">${srcLabel(p.source_url)}</a>` : ""}
        ${uses.length ? `<span class="uses">후보: ${uses.join(" · ")}</span>` : ""}
        <button class="abtn del" style="margin-left:auto;padding:5px 10px" data-pdel="${p.id}">삭제</button></div>
    </div>`;
  }
  return html + `</div>`;
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요"); }
  catch (e) { prompt("아래 내용을 복사하세요", text); }
}

async function q(table) {
  const { data: rows, error } = await client.from(table).select("*").order("created_at", { ascending: false }).limit(LIMIT);
  if (error) throw error;
  return rows;
}

async function load() {
  const btn = $("#refresh");
  btn.classList.add("spin");
  try {
    const [visits, audit, cheers, bugs, total, ppl, settings] = await Promise.all([
      q("trip_visits"), q("trip_audit"), q("trip_cheers"), q("trip_bugs"), client.rpc("cheer_count"),
      client.from("trip_people").select("name,photo"), client.rpc("admin_settings"),
    ]);
    const [opts, slts, plcs] = await Promise.all([
      client.from("trip_options").select("id,slot_id,title"),
      client.from("trip_slots").select("id,day,time,title,chosen_id"),
      client.from("trip_places").select("*").order("category").order("source").order("name"),
    ]);
    optNames = Object.fromEntries((opts.data || []).map(o => [o.id, o.title]));
    photos = Object.fromEntries((ppl.data || []).filter(p => p.photo).map(p => [p.name, p.photo]));
    data = { visits, audit, cheers, bugs, cheerTotal: Number(total.data || 0), settings: settings.data || {},
             options: opts.data || [], slots: slts.data || [], places: plcs.data || [] };
    const p = n => String(n).padStart(2, "0"), d = new Date();
    $("#upd").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} 기준`;
    render();
  } catch (e) {
    $("#upd").textContent = "불러오지 못했어요 — " + (e.message || e);
  }
  btn.classList.remove("spin");
}

// 암호 바꾸기
$("#view").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.kind;
  if (form.id === "pform") {
    // 장소 추가 — 지도 링크는 이름으로 만든다
    const f = Object.fromEntries(new FormData(form).entries());
    const name = f.name.trim();
    const row = { name, category: f.category, area: f.area.trim() || null, menu: f.menu.trim() || null, memo: f.memo.trim() || null,
                  source: "관리자 추가", source_url: f.source_url.trim(), photo_url: f.photo_url.trim() || null,
                  map_url: "https://map.naver.com/p/search/" + encodeURIComponent("거제 " + name) };
    const { error } = await client.from("trip_places").insert(row);
    if (error) return toast(/duplicate|unique/.test(error.message) ? "이미 있는 장소예요" : "추가하지 못했어요 — " + error.message);
    toast("장소를 추가했어요");
    return load();
  }
  const p = form.p.value.trim();
  if (kind === "admin" && p !== form.p2.value.trim()) return toast("두 번 적은 암호가 달라요");
  const what = kind === "trip" ? "여행 암호" : "관리자 암호";
  if (!confirm(kind === "trip" ? `여행 암호를 «${p}» 로 바꿀까요?\n모든 사람이 새 암호를 다시 입력해야 해요.` : `${what}를 바꿀까요?`)) return;
  const { error } = await client.rpc("admin_set_pass", { kind, new_pass: p });
  if (error) return toast("바꾸지 못했어요 — " + error.message);
  if (kind === "admin") { localSet(KEY, p); connect(p); }   // 바꾼 암호로 계속 본다
  toast(`${what}를 바꿨어요`);
  load();
});

  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const pass = (data.settings || {}).trip_pass || "";
    return copy(cp.dataset.copy === "pass" ? pass : `🏝️ 거제 여행\n${SITE}\n여행 암호: ${pass}`);
  }
  const m = e.target.closest("[data-more]");
  if (m) { shown[m.dataset.more] += 100; return render(); }
  const f = e.target.closest("[data-filter]");
  if (f) { bugFilter = f.dataset.filter; return render(); }
  const s = e.target.closest("[data-status]");
  if (s) {
    const b = data.bugs.find(x => String(x.id) === s.dataset.status);
    const status = b.status === "new" ? "done" : "new";
    b.status = status;
    render();
    const { error } = await client.from("trip_bugs").update({ status }).eq("id", b.id);
    if (error) { alert("바꾸지 못했어요: " + error.message); load(); }
    return;
  }
  const d = e.target.closest("[data-del]");
  if (d) {
    if (!confirm("이 문의를 지울까요?")) return;
    data.bugs = data.bugs.filter(x => String(x.id) !== d.dataset.del);
    render();
    const { error } = await client.from("trip_bugs").delete().eq("id", d.dataset.del);
    if (error) { alert("지우지 못했어요: " + error.message); load(); }
  }
};

$("#refresh").onclick = load;
$("#logout").onclick = () => { localDel(KEY); location.reload(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && client && $("#lock").hidden) load(); });

// ─────────────────────────────────────────────────────────────
// 시작 — 관리자 암호 확인
// ─────────────────────────────────────────────────────────────
async function check(key) {
  connect(key);
  const { data: ok, error } = await client.rpc("admin_ok");
  if (error) throw error;
  return ok === true;
}

$("#lockForm").onsubmit = async e => {
  e.preventDefault();
  const key = $("#lockInput").value.trim();
  if (!key) return;
  try {
    if (await check(key)) {
      localSet(KEY, key);
      $("#lock").hidden = true;
      return load();
    }
    $("#lockErr").textContent = "암호가 맞지 않아요";
  } catch (err) {
    $("#lockErr").textContent = "연결하지 못했어요";
  }
};

(async () => {
  const saved = localGet(KEY);
  if (saved) {
    try { if (await check(saved)) return load(); } catch (e) {}
    localDel(KEY);
  }
  $("#lock").hidden = false;
  setTimeout(() => $("#lockInput").focus(), 100);
})();
</script>
